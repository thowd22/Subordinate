[package]
name = "spike-guest-looper"
description = "TASK-9 spike guest: loops forever so the host's fuel and epoch limits can be observed"
publish = false
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.61"

[profile.release]
opt-level = "s"
strip = true

# Its own workspace: the guest targets wasm32-wasip2 and must stay out of the
# host workspace's build and lint graph.
[workspace]
