[package]
name = "spike-wasm-command-world"
description = "TASK-9 spike: the subordinate:plugin@0.1.0 command world run through wasmtime, with fuel and epoch limits"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde_json = "1"
sub-core = { version = "0.1.0", path = "../../crates/sub-core" }
sub-time = { version = "0.1.0", path = "../../crates/sub-time" }
tracing = "0.1"
wasmtime = { version = "48", default-features = false, features = [
    "component-model",
    "cranelift",
    "runtime",
    "std",
] }
wasmtime-wasi = { version = "48", default-features = false, features = ["p2"] }

[lints]
workspace = true
