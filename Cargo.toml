[workspace]
resolver = "3"
members = [
    "crates/sub-core",
    "crates/sub-time",
    "crates/sub-model",
    "crates/sub-edit",
    "crates/sub-media",
    "crates/sub-audio",
    "crates/sub-render",
    "crates/sub-export",
    "crates/sub-command",
    "crates/sub-plugin",
    "crates/sub-ui",
    "bins/subordinate",
    "bins/subordinate-cli",
    "bins/subordinate-mcp",
    "sdk/subordinate-sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
repository = "https://github.com/thowd22/Subordinate"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
