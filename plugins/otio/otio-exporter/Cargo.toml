[package]
name = "otio-exporter"
description = "Subordinate command plugin: writes one sequence as OpenTimelineIO JSON"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# `cdylib` is what wasm32-wasip2 turns into a component; `rlib` lets the
# argument handling and the report shape be unit-tested on the host triple.
crate-type = ["cdylib", "rlib"]

[dependencies]
otio-core = { workspace = true }
serde_json = { workspace = true }
wit-bindgen = { workspace = true }

[lints]
workspace = true
