[package]
name = "sub-command"
description = "The Command API: JSON-RPC 2.0 dispatch and the local socket server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sub-core = { path = "../sub-core" }
sub-edit = { path = "../sub-edit" }
sub-model = { path = "../sub-model" }
sub-time = { path = "../sub-time" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tracing = "0.1"
interprocess = { version = "2", default-features = false }

# The phase 2 exit criterion (tests/end_to_end_edit.rs) assembles an edit over
# the Command API and then renders a frame of it, so the test build takes the
# compositor and the wgpu types a frame source is built from.
[dev-dependencies]
sub-render = { path = "../sub-render" }
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12", "webgpu"] }

[lints]
workspace = true
