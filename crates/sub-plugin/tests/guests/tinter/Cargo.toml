[package]
name = "sub-plugin-guest-tinter"
description = "TASK-91 test guest: an effect plugin declaring one parameter and a WGSL fragment entry point"
publish = false
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.61"

[profile.release]
opt-level = "s"
strip = true

# Its own workspace, like the other test guests.
[workspace]
