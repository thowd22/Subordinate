[package]
name = "sub-plugin"
description = "WASM plugin host on wasmtime: manifests, capabilities, WIT worlds and hot reload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1"
# Argument validation for plugin-contributed MCP tools. Default features off:
# they pull reqwest and rustls to resolve remote `$ref`s, and a plugin's tool
# schema must be self-contained, never fetched from the network at call time.
jsonschema = { version = "0.55", default-features = false }
schemars = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
thiserror = "2"
tracing = "0.1"
toml = { version = "1", default-features = false, features = ["parse", "display", "serde"] }
sub-command = { version = "0.1.0", path = "../sub-command" }
sub-core = { version = "0.1.0", path = "../sub-core" }
sub-edit = { version = "0.1.0", path = "../sub-edit" }
sub-model = { version = "0.1.0", path = "../sub-model" }
sub-time = { version = "0.1.0", path = "../sub-time" }
wasmtime = { version = "48", default-features = false, features = [
    "component-model",
    # The host compiles plugin components in-process, so it needs a compiler,
    # and fuel metering and epoch interruption are code the compiler emits.
    "cranelift",
    "runtime",
    "std",
] }
# The capability model builds the sandbox's WASI context: a granted root becomes
# a preopened directory and everything else stays closed. "p2" is the
# component-model preview 2 context the plugin worlds are built against.
wasmtime-wasi = { version = "48", default-features = false, features = ["p2"] }

[features]
# Test-only: makes the build script compile the `tests/guests` components for
# `wasm32-wasip2`. The crate switches it on for its own tests through the
# dev-dependency below, so a plain build of the library compiles no WASM.
test-guests = []

[dev-dependencies]
sub-edit = { version = "0.1.0", path = "../sub-edit" }
# Self dev-dependency: the only way to turn a feature on for this crate's own
# test targets and nothing else.
sub-plugin = { version = "0.1.0", path = ".", features = ["test-guests"] }

[lints]
workspace = true
