[package]
name = "sub-ui"
description = "The egui application: timeline, media bin, viewer, inspector and export panels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11", "accesskit"] }
log = "0.4"
rfd = "0.17"
sub-audio = { version = "0.1.0", path = "../sub-audio" }
sub-core = { version = "0.1.0", path = "../sub-core" }
sub-edit = { version = "0.1.0", path = "../sub-edit" }
sub-export = { version = "0.1.0", path = "../sub-export" }
sub-media = { version = "0.1.0", path = "../sub-media" }
sub-model = { version = "0.1.0", path = "../sub-model" }
sub-plugin = { version = "0.1.0", path = "../sub-plugin" }
sub-render = { version = "0.1.0", path = "../sub-render" }
sub-time = { version = "0.1.0", path = "../sub-time" }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot", "eframe"] }
jpeg-encoder = "0.7"
sub-test-support = { path = "../sub-test-support" }

[lints]
workspace = true
