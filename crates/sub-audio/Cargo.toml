[package]
name = "sub-audio"
description = "Audio decode, resampling, the lock-free mixer graph and cpal output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ringbuf = "0.5"
rubato = { version = "5", default-features = false }
sub-core = { path = "../sub-core" }
sub-time = { path = "../sub-time" }
symphonia = { version = "0.6", features = ["aac", "isomp4", "mp3"] }
tracing = "0.1"

[lints]
workspace = true

[dev-dependencies]
sub-test-support = { path = "../sub-test-support" }
