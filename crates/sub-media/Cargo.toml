[package]
name = "sub-media"
description = "Media I/O built on GStreamer: probing, decoding, seeking, thumbnails and proxies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sub-core = { path = "../sub-core" }
sub-model = { path = "../sub-model" }
sub-time = { path = "../sub-time" }
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-pbutils = "0.25"
gstreamer-video = { version = "0.25", features = ["v1_18"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
sub-test-support = { path = "../sub-test-support" }

[lints]
workspace = true
