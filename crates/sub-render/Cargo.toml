[package]
name = "sub-render"
description = "GPU compositor on wgpu: frame graph, NV12 conversion, transforms and shader effects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Cache key for a compiled effect: a digest of the shader source, its entry
# point and the uniform layout derived from the plugin's parameters.
blake3 = "1"
sub-model = { path = "../sub-model" }
sub-time = { path = "../sub-time" }
pollster = "1.0"
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12", "webgpu"] }

[lints]
workspace = true
