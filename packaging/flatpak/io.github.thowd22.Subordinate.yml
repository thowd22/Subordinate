# Flatpak manifest for Subordinate.
#
# Unlike the AppImage, this package does not carry its own GStreamer: the
# freedesktop runtime already ships GStreamer and declares the
# `org.freedesktop.Platform.GStreamer` extension point
# (directory lib/extensions/gstreamer-1.0, already on the runtime's
# GST_PLUGIN_SYSTEM_PATH), so extra plugin sets drop in without rebuilding the
# app.
#
# Runtime branch 25.08, not 24.08, for two reasons:
#
#   * org.freedesktop.Sdk.Extension.rust-stable on 24.08 is frozen at rustc
#     1.89, and this workspace declares rust-version = 1.95; cargo refuses the
#     build outright ("rustc 1.89.0 is not supported by the following
#     packages", run 34626701087). The 25.08 branch of the extension tracks
#     current stable.
#   * 25.08 retired org.freedesktop.Platform.ffmpeg-full. The full codec set is
#     now org.freedesktop.Platform.codecs-extra, an extension the *runtime*
#     declares (version 25.08-extra, add-ld-path, auto-downloaded) whose
#     GStreamer directory the runtime already has on GST_PLUGIN_SYSTEM_PATH.
#     So the app declares nothing: no add-extensions block and no
#     LD_LIBRARY_PATH finish-arg, and the libav elements several export presets
#     use are simply there.
#
# Hardware paths:
#   * VA-API  -- the runtime's `va` plugin over the host driver through
#                --device=dri, plus org.freedesktop.Platform.VAAPI.Intel on
#                Intel hosts.
#   * NVENC   -- the nvcodec plugin over the NVIDIA userspace that flatpak
#                mounts as org.freedesktop.Platform.GL.nvidia-<version>.
# Neither driver is ever bundled; the host's must match its kernel module.
#
# Build it with packaging/flatpak/build-flatpak.sh (or flatpak-builder
# directly). The cargo build runs with --share=network because the crate
# sources are fetched at build time; a Flathub submission would replace that
# with a generated cargo-sources.json, which is deliberately not committed here
# (it is a six-figure-line file that churns with every Cargo.lock change).
# Nothing else about the manifest would change for Flathub -- in particular the
# toolchain still comes from the SDK extension, never from rustup over the
# network.
id: io.github.thowd22.Subordinate
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: subordinate

finish-args:
  # Display and input.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # wgpu needs the GPU; so do the va and nvcodec plugins.
  - --device=dri

  # Audio monitoring.
  - --socket=pulseaudio
  # Media files and projects live wherever the user keeps them.
  - --filesystem=home

# No add-extensions block: the extensions this app needs
# (org.freedesktop.Platform.GStreamer for extra plugin sets,
# org.freedesktop.Platform.codecs-extra for the full ffmpeg codec set,
# org.freedesktop.Platform.GL.* for the driver) are all declared by the runtime
# itself, mounted under /usr and already on GST_PLUGIN_SYSTEM_PATH and the
# loader path. Re-declaring them here would shadow the runtime's own paths.

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'

modules:
  - name: subordinate
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/subordinate/cargo
        # Matches the workspace jobs cap the agents use; flatpak-builder runs
        # on shared CI hardware.
        CARGO_BUILD_JOBS: '2'
    build-commands:
      - cargo build --release -p subordinate -p subordinate-cli
      - install -Dm755 target/release/subordinate /app/bin/subordinate
      - install -Dm755 target/release/subordinate-cli /app/bin/subordinate-cli
      - install -Dm644 packaging/linux/subordinate.desktop
        /app/share/applications/io.github.thowd22.Subordinate.desktop
      - install -Dm644 packaging/linux/io.github.thowd22.Subordinate.metainfo.xml
        /app/share/metainfo/io.github.thowd22.Subordinate.metainfo.xml
      - install -Dm644 packaging/linux/subordinate.svg
        /app/share/icons/hicolor/scalable/apps/io.github.thowd22.Subordinate.svg
    sources:
      - type: dir
        path: ../..
        # A local build tree holds gigabytes flatpak-builder would otherwise
        # copy into the build directory before compiling anything.
        skip:
          - target
          - .git
          - fixtures
          - .claude
