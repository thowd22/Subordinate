# RunsOn runner definitions (TASK-114).
#
# Workflows reference the stable names below instead of raw EC2 parameters:
#
#   runs-on: runs-on=${{ github.run_id }}/runner=gpu-nvidia-linux
#
# Schema: https://runs-on.com/configuration/repo-config/
# GPU images: https://runs-on.com/runners/gpu/
# Built-in images (incl. windows22-full-x64): https://runs-on.com/docs/runners/platforms/
#
# Cost: RunsOn has no per-runner cost-cap field in this schema (v3.3.0), so the
# us-east-1 list prices are recorded in the comments on each runner. Instances
# are billed by AWS with no markup and are terminated when the job ends; keep
# `timeout-minutes` set on every GPU job so a hung job cannot burn a day of GPU
# time. `spot: price-capacity-optimized` picks the cheapest pool with capacity;
# `retry: when-interrupted` re-runs a job whose spot instance was reclaimed. If
# spot capacity is unavailable, re-dispatch the job with `/spot=false` appended
# to the runs-on label to force on-demand.
#
# All GPU runners need the EC2 G-family vCPU quotas in us-east-1 above zero
# (L-DB2E81BA on-demand, L-3819A6DF spot) - see TASK-113.

runners:
  # NVIDIA T4 (16 GB), 4 vCPU / 16 GB RAM.
  # us-east-1 on-demand $0.526/h, spot typically $0.16-0.25/h.
  # ubuntu24-gpu-x64 ships the NVIDIA driver, CUDA toolkit and container
  # toolkit. It is Ubuntu 24.04, whose apt GStreamer is 1.24 - one minor below
  # the 1.28 pin in ci.yml - so jobs that need 1.28 on this runner must bring
  # their own build (TASK-116).
  gpu-nvidia-linux:
    family: ["g4dn.xlarge"]
    cpu: [4, 4]
    ram: [16, 16]
    image: ubuntu24-gpu-x64
    spot: price-capacity-optimized
    retry: when-interrupted
    volume: 80gb:gp3:125mbs:3000iops
    ssh: false

  # AMD Radeon Pro V520 (8 GB), 4 vCPU / 16 GB RAM.
  # us-east-1 on-demand $0.37853/h, spot typically $0.11-0.16/h.
  # RunsOn's *-gpu-* images are NVIDIA-only (driver + CUDA), so this runner uses
  # the plain Ubuntu 26.04 image and the job installs the Mesa VA-API stack
  # (mesa-va-drivers, vainfo). 26.04 also matches ci.yml's GStreamer 1.28 apt
  # packages, where the `va` plugin (vah264enc) lives in
  # gstreamer1.0-plugins-bad - there is no separate `va` package.
  gpu-amd-linux:
    family: ["g4ad.xlarge"]
    cpu: [4, 4]
    ram: [16, 16]
    image: ubuntu26-full-x64
    spot: price-capacity-optimized
    retry: when-interrupted
    volume: 80gb:gp3:125mbs:3000iops
    ssh: false

  # NVIDIA T4 (16 GB) on Windows Server 2022, 4 vCPU / 16 GB RAM.
  # us-east-1 on-demand $0.746/h (Windows licence included); Windows spot is
  # rarely discounted, so budget the on-demand rate.
  #
  # No custom AMI is needed (TASK-115): RunsOn's stock `windows22-full-x64`
  # image boots fine on a g4dn instance, it simply has no NVIDIA driver. The
  # job installs the AWS-published driver from the public bucket
  # s3://ec2-windows-nvidia-drivers with `-s -n` (silent, no reboot); the
  # driver loads without a restart, which matters because a RunsOn ephemeral
  # runner cannot survive one. See docs/DEVELOPMENT.md "GPU CI (RunsOn)" and
  # the `nvidia-windows` job in .github/workflows/gpu-smoke.yml for the recipe
  # to copy into any job that uses this runner.
  gpu-nvidia-windows:
    family: ["g4dn.xlarge"]
    cpu: [4, 4]
    ram: [16, 16]
    image: windows22-full-x64
    spot: price-capacity-optimized
    retry: when-interrupted
    volume: 120gb:gp3:125mbs:3000iops
    ssh: false

  # NVIDIA T4 (16 GB) on Windows Server 2022, with a *desktop*: 4 vCPU / 16 GB.
  # us-east-1 on-demand $0.746/h, same as `gpu-nvidia-windows`; the image saves
  # the 100 s driver install and the MSI download, so a job is shorter.
  #
  # Custom AMI (TASK-138), built by EC2 Image Builder from the same stock
  # `windows22-full-x64` parent - see infra/images/windows-desktop/. On top of
  # it: the NVIDIA driver, the released MSI with its bundled GStreamer 1.28,
  # Python with pywinauto, the 4K test clip in C:\SubordinateTest, and a local
  # user Windows logs on automatically at boot so there is a real console
  # session with a desktop.
  #
  # Use this runner only for jobs that have to *see* the application. The
  # RunsOn agent still runs as SYSTEM in session 0, which has no desktop and
  # cannot even create a swapchain, so such a job sends its work into the
  # console session through C:\SubordinateTest\bin\InteractiveSession.psm1.
  # The `nvidia-desktop-windows` job in .github/workflows/gpu-smoke.yml is the
  # worked example.
  #
  # Rebuild the AMI at least every 30 days - GitHub stops dispatching jobs to a
  # runner whose agent binary is older than that - and update the id here.
  gpu-nvidia-desktop-windows:
    family: ["g4dn.xlarge"]
    cpu: [4, 4]
    ram: [16, 16]
    image: subordinate-windows-desktop
    # Windows spot is rarely discounted and a reclaimed instance in the middle
    # of a UI interaction is just noise, so this one is on-demand.
    spot: false
    volume: 120gb:gp3:125mbs:3000iops
    ssh: false

  # There is deliberately no `gpu-amd-windows` runner: AWS has retired g4ad and
  # offers no other AMD GPU instance type, so AMF/amfh264enc cannot be verified
  # in this account at all. AMD Linux (VA-API) runs on the self-hosted `box`
  # runner; AMD Windows stays manual until an AMD Windows machine exists.

# Custom AMIs. RunsOn needs the platform and architecture spelled out for an
# image it did not build, and either an exact `ami` or a `name` wildcard.
# Schema: https://runs-on.com/docs/runners/custom/
images:
  # Built by infra/images/windows-desktop/build.sh (TASK-138). The id is
  # pinned rather than matched by name so that a rebuild has to be adopted
  # deliberately; `name: subordinate-windows-desktop-*` would pick the newest
  # build automatically, including a broken one.
  subordinate-windows-desktop:
    platform: windows
    arch: x64
    owner: "731537225673"
    ami: AMI_ID_PLACEHOLDER
