name: Hardware verification

# Runs the hardware encode and decode criteria (TASK-116) on real GPUs: it
# renders the sample project with each vendor's encoder through
# subordinate-cli, validates the file with the discoverer, measures the 4K
# H.264 scrub rate with a hardware decoder and the compositor readback
# throughput, and uploads the output, perf.json and the gst-inspect
# diagnostics. The verify tasks (TASK-64, TASK-65) are checked from this
# workflow's logs and artifacts rather than by hand.
#
# ---------------------------------------------------------------- cost ------
# nvidia-linux runs on RunsOn (.github/runs-on.yml, runner gpu-nvidia-linux):
# one g4dn.xlarge in us-east-1, spot `price-capacity-optimized` at typically
# 0.16-0.25 USD/h, 0.526 USD/h if it falls back to on-demand. `timeout-minutes`
# caps the job at 20 minutes, so the worst case is
#
#   spot      0.25 USD/h * 20/60 h = 0.083 USD
#   on-demand 0.526 USD/h * 20/60 h = 0.175 USD
#
# and a warm run (rust-cache hit) finishes in well under half that. Storage is
# the instance's own root volume, deleted with the instance. Budget: under
# 0.10 USD per run on spot, under 0.25 USD in every case, which is the number
# TASK-116 AC 4 states. amd-linux runs on the self-hosted box and costs
# nothing, so only the NVIDIA job is money.
#
# Triggers are deliberately narrow for the same reason: on demand, plus one
# nightly schedule. Never add `push` or `pull_request` here - the AMD job is
# free but the NVIDIA job is not, and box is a machine in someone's home (see
# docs/DEVELOPMENT.md, "Self-hosted AMD runner").
on:
  workflow_dispatch:
  # TEMPORARY (TASK-116 verification only, removed before this branch merges):
  # a workflow that is not yet on the default branch cannot be dispatched -
  # the API answers 404 - so the only way to run this file at all while it is
  # being written is a push trigger scoped to its own branch.
  push:
    branches: [task/task-116]
  schedule:
    # 04:30 UTC, once a day. One NVIDIA job a night is about 2.50 USD a month.
    - cron: "30 4 * * *"

permissions:
  contents: read

concurrency:
  group: hardware-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # The preset the sample project is rendered with: H.264 in MP4 with AAC, so
  # both vendor encoders can be pinned against the same output.
  PRESET: youtube-1080p

jobs:
  nvidia-linux:
    name: NVIDIA T4 (g4dn.xlarge, Ubuntu 24.04)
    runs-on: runs-on=${{ github.run_id }}/runner=gpu-nvidia-linux
    # Hard stop on GPU spend; see the cost note in the header. A cold cache
    # (release subordinate-bench plus a debug subordinate-cli) is the slow
    # case; a warm one is a few minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Instance and GPU facts
        run: |
          echo "runner=$RUNNER_NAME"
          curl -fsS -m 3 http://169.254.169.254/latest/meta-data/instance-type || true; echo
          curl -fsS -m 3 http://169.254.169.254/latest/meta-data/instance-life-cycle || true; echo
          . /etc/os-release && echo "os=$PRETTY_NAME"
          nvidia-smi

      # ubuntu24-gpu-x64 is Ubuntu 24.04, whose apt GStreamer is 1.24 rather
      # than the 1.28 pinned in ci.yml. That is accepted here: the elements
      # this workflow exercises (nvcodec's nvh264enc/nvh264dec) have shipped
      # since well before 1.24, and building 1.28 from source would cost more
      # GPU minutes than the whole job. The version is recorded in the
      # diagnostics artifact so a difference in the numbers can be traced to
      # it. Replace this with a 26.04 GPU image when one exists.
      #
      # libvulkan1 and the Mesa/NVIDIA ICDs are what wgpu needs: without a
      # Vulkan loader the compositor silently falls back to a software adapter
      # and the readback number stops meaning anything (the summary marks that
      # case). xvfb is belt and braces for anything that wants a display.
      - name: Install GStreamer and the Vulkan loader (apt)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*google*.list \
                     /etc/apt/sources.list.d/*google*.sources \
                     /etc/apt/sources.list.d/*microsoft*.list \
                     /etc/apt/sources.list.d/*microsoft*.sources || true
          sudo apt-get update || sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x pkg-config \
            libasound2-dev libvulkan1 vulkan-tools xvfb
          echo "gstreamer-1.0 = $(pkg-config --modversion gstreamer-1.0)"
          vulkaninfo --summary 2>&1 | head -40 || echo "vulkaninfo failed; wgpu may fall back to software"

      - name: GStreamer diagnostics
        run: |
          mkdir -p target/hardware
          {
            gst-inspect-1.0 --version
            echo "pkg-config gstreamer-1.0: $(pkg-config --modversion gstreamer-1.0)"
            echo "--- element presence ---"
            for e in nvh264enc nvh265enc nvh264dec nvh264sldec nvautogpuh264enc x264enc avdec_h264 avenc_aac; do
              if gst-inspect-1.0 --exists "$e"; then echo "present  $e"; else echo "absent   $e"; fi
            done
            echo "--- nvcodec plugin ---"
            gst-inspect-1.0 nvcodec || true
            echo "--- nvh264enc ---"
            gst-inspect-1.0 nvh264enc || true
          } > target/hardware/gst-inspect.txt 2>&1
          sed -n '1,60p' target/hardware/gst-inspect.txt
          gst-inspect-1.0 --exists nvh264enc \
            || { echo "::error::nvh264enc missing: this runner cannot verify NVENC"; exit 1; }

      # rust-toolchain.toml pins the version; this action honours it.
      - uses: dtolnay/rust-toolchain@stable

      # A distinct shared-key: these are GPU-runner artifacts built on Ubuntu
      # 24.04 against GStreamer 1.24 and must never be mixed with ci.yml's.
      # save-if keeps one archive rather than one per branch.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hardware-nvidia-linux
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          cache-workspace-crates: true

      # Only the two binaries this job needs, never the whole workspace: the
      # GUI and the plugin hosts are not part of any criterion here.
      # subordinate-bench is release, because the fps numbers are compared
      # against docs/PERFORMANCE.md's release baselines; subordinate-cli is
      # debug, because its render is encoder-bound and a release build of it
      # drags in a thin-LTO wasmtime that costs more GPU minutes than it saves.
      - name: Build subordinate-bench (release) and subordinate-cli
        run: |
          cargo build --release -p subordinate-bench
          cargo build -p subordinate-cli

      - name: Generate test fixtures
        run: ./scripts/gen-fixtures.sh

      - name: Fetch the sample project media
        run: ./scripts/get-sample-media.sh

      # The encode criterion: the real sample project, rendered through the
      # production export pipeline with NVENC pinned, then read back by the
      # discoverer. --verify makes the CLI probe the file itself; the separate
      # gst-discoverer-1.0 run is the independent check and the artifact.
      - name: Render the sample project with NVENC
        run: |
          mkdir -p target/hardware
          xvfb-run -a ./target/debug/subordinate-cli render examples/sample-project/demo.sub \
            --preset "$PRESET" --encoder nvh264enc --verify \
            --out target/hardware/sample-nvh264enc.mp4 \
            | tee target/hardware/render.json
          ls -l target/hardware/sample-nvh264enc.mp4
          gst-discoverer-1.0 target/hardware/sample-nvh264enc.mp4 \
            | tee target/hardware/discoverer.txt
          grep -q 'H.264' target/hardware/discoverer.txt \
            || { echo "::error::the rendered file carries no H.264 stream"; exit 1; }

      # The decode criterion: 4K H.264 scrub through the production decoder,
      # which prefers a hardware decoder when the machine has one. The summary
      # step below asserts both the rate and that the element chosen really was
      # nvdec and not avdec_h264.
      - name: Scrub and playback benchmark (hardware decode)
        run: |
          xvfb-run -a ./target/release/subordinate-bench --out target/bench/perf.json \
            | tee target/hardware/bench-summary.txt
          cp target/bench/perf.json target/hardware/perf.json

      # Compositor readback throughput on a 1080p canvas: TASK-58 AC 2, which
      # could not be measured on a software adapter and moved here. The test is
      # #[ignore]d so it only ever runs on a job like this one.
      - name: Compositor readback throughput (1080p)
        run: |
          xvfb-run -a cargo test --release -p sub-render --test readback -- --ignored --nocapture \
            | tee target/hardware/readback.txt

      - name: Job summary and criteria
        if: always()
        run: |
          python3 scripts/hardware-summary.py \
            --label "NVIDIA T4 (g4dn.xlarge)" \
            --perf target/bench/perf.json \
            --readback target/hardware/readback.txt \
            --min-scrub-fps 30 \
            --min-readback-fps 60 \
            --require-hardware-decode nvh,nvdec,nvv4l2 \
            --out target/hardware/summary.md
          cat target/hardware/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-nvidia-linux
          path: |
            target/hardware/
          if-no-files-found: warn
          retention-days: 30

  amd-linux:
    # AWS no longer offers an AMD GPU instance (g4ad is retired), so this job
    # runs on "box", a user-owned mini PC with an AMD Cezanne APU registered as
    # a self-hosted runner: GStreamer 1.28, mesa VA-API, Rust and the fixture
    # tools are already installed, so this job validates rather than installs,
    # and it costs nothing. See docs/DEVELOPMENT.md, "Self-hosted AMD runner".
    name: AMD APU (box, self-hosted, Ubuntu 26.04)
    runs-on: [self-hosted, linux, box, amd-gpu]
    timeout-minutes: 30
    env:
      GST_MINOR: "1.28"
    steps:
      - uses: actions/checkout@v4

      - name: Host, DRM and GStreamer facts
        run: |
          echo "runner=$RUNNER_NAME"
          . /etc/os-release && echo "os=$PRETTY_NAME"
          ls -l /dev/dri
          id -nG
          v=$(pkg-config --modversion gstreamer-1.0); echo "gstreamer-1.0 = $v"
          case "$v" in "$GST_MINOR".*) ;; *) echo "::error::expected GStreamer $GST_MINOR.x, got $v"; exit 1;; esac

      - name: GStreamer and VA-API diagnostics
        run: |
          mkdir -p target/hardware
          {
            gst-inspect-1.0 --version
            echo "pkg-config gstreamer-1.0: $(pkg-config --modversion gstreamer-1.0)"
            echo "--- vainfo ---"
            vainfo --display drm --device /dev/dri/renderD128 || true
            echo "--- element presence ---"
            for e in vah264enc vah265enc vah264dec vapostproc x264enc avdec_h264 avenc_aac; do
              if gst-inspect-1.0 --exists "$e"; then echo "present  $e"; else echo "absent   $e"; fi
            done
            echo "--- vah264enc ---"
            gst-inspect-1.0 vah264enc || true
          } > target/hardware/gst-inspect.txt 2>&1
          sed -n '1,60p' target/hardware/gst-inspect.txt
          gst-inspect-1.0 --exists vah264enc \
            || { echo "::error::vah264enc missing: check the render/video groups"; exit 1; }

      # box keeps its target directory between runs on local disk, so there is
      # no rust-cache here: an Actions cache archive would be slower than the
      # disk it already has.
      - name: Build subordinate-bench (release) and subordinate-cli
        run: |
          cargo build --release -p subordinate-bench
          cargo build -p subordinate-cli

      - name: Generate test fixtures
        run: ./scripts/gen-fixtures.sh

      - name: Fetch the sample project media
        run: ./scripts/get-sample-media.sh

      - name: Render the sample project with VA-API
        run: |
          mkdir -p target/hardware
          xvfb-run -a ./target/debug/subordinate-cli render examples/sample-project/demo.sub \
            --preset "$PRESET" --encoder vah264enc --verify \
            --out target/hardware/sample-vah264enc.mp4 \
            | tee target/hardware/render.json
          ls -l target/hardware/sample-vah264enc.mp4
          gst-discoverer-1.0 target/hardware/sample-vah264enc.mp4 \
            | tee target/hardware/discoverer.txt
          grep -q 'H.264' target/hardware/discoverer.txt \
            || { echo "::error::the rendered file carries no H.264 stream"; exit 1; }

      - name: Scrub and playback benchmark (hardware decode)
        run: |
          xvfb-run -a ./target/release/subordinate-bench --out target/bench/perf.json \
            | tee target/hardware/bench-summary.txt
          cp target/bench/perf.json target/hardware/perf.json

      # Reported, not gated: the 60 fps readback criterion (TASK-58) is stated
      # against the NVIDIA job. This APU's number is recorded for comparison.
      - name: Compositor readback throughput (1080p)
        run: |
          xvfb-run -a cargo test --release -p sub-render --test readback -- --ignored --nocapture \
            | tee target/hardware/readback.txt

      - name: Job summary and criteria
        if: always()
        run: |
          python3 scripts/hardware-summary.py \
            --label "AMD Cezanne APU (box)" \
            --perf target/bench/perf.json \
            --readback target/hardware/readback.txt \
            --min-scrub-fps 30 \
            --require-hardware-decode va \
            --out target/hardware/summary.md
          cat target/hardware/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-amd-linux
          path: |
            target/hardware/
          if-no-files-found: warn
          retention-days: 30

  # ----------------------------------------------------------------------
  # Windows jobs: deliberately absent, not forgotten (TASK-116 AC 1).
  #
  #   nvidia-windows - needs the GPU AMI TASK-115 builds (NVIDIA driver,
  #     GStreamer 1.28 and the RunsOn agent). Until that AMI id replaces the
  #     placeholder in .github/runs-on.yml, a job asking for
  #     `runner=gpu-nvidia-windows` fails to launch. When it exists, copy the
  #     nvidia-linux job, swap the shell to pwsh, install GStreamer with the
  #     official MSVC installer as ci.yml does, and pin `--encoder mfh264enc`
  #     or `nvh264enc`.
  #
  #   amd-windows - no hardware exists at all: AWS retired g4ad, there is no
  #     AMD Windows host, and AMF cannot be exercised anywhere this project can
  #     reach. TASK-65's AMF half stays manual until someone has such a
  #     machine. Do not add a job that would silently pass on software.
  # ----------------------------------------------------------------------
