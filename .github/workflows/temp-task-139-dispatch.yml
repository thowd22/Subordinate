name: TEMP TASK-139 dispatch

# TEMPORARY. A workflow_dispatch workflow can only be dispatched once it is on
# the default branch, and desktop-flows.yml is not there yet, so this caller
# exists to run it from task/task-139 while it is being brought up. Delete
# before the task is finished.
on:
  push:
    branches:
      - task/task-139
    paths:
      - ".github/workflows/desktop-flows.yml"
      - ".github/workflows/temp-task-139-dispatch.yml"
      - ".github/actions/windows-desktop-flow/action.yml"
      - "scripts/desktop/**"

permissions:
  contents: read

jobs:
  flows:
    uses: ./.github/workflows/desktop-flows.yml
    with:
      only: ''
      linux_runner: ami=ami-08dbaf8367717a9a3/family=g4dn.xlarge/spot=false
      windows_runner: ami=ami-0b3c82cb19d31ac1d/family=g4dn.xlarge/spot=false
