name: Desktop flows

# The two end-to-end flows on the desktop images (TASK-139).
#
# `mcp` drives `subordinate-mcp` and nothing else while the real window stands
# on screen; `clicks` uses input only - a real pointer and real keystrokes -
# and asserts what the project became through read-only Command API calls.
# Both photograph the desktop after every step, and a failing step is named in
# an `::error::` annotation with the file name of its screenshot, which is
# uploaded with the rest of the run.
#
# Hosted builders compile the selected commit once. Paid desktops consume those
# artifacts, using the image only for its desktop session and sample media.
# Box and yodaddy run offscreen UI and real MCP regressions without interacting
# with their owners' desktop sessions.
#
# ---------------------------------------------------------------- cost ------
# Each flow is one `g4dn.xlarge`:
#
#   Linux   spot, typically 0.16-0.25 USD/h, capped at 20 minutes -> 0.08 USD
#           worst case, and a passing run is 6-8 minutes -> about 0.03 USD
#   Windows on-demand 0.746 USD/h (Windows spot is rarely discounted and a
#           reclaimed instance mid-gesture is only noise), capped at 22
#           minutes -> 0.27 USD worst case, 0.10-0.13 USD for a passing run
#
# so every flow is under the 0.30 USD per run TASK-139 asks for, and all four
# together are about 0.30 USD a night. The account's G-family quota is 8 vCPU -
# exactly two g4dn.xlarge - so the clicks jobs wait on the MCP jobs rather than
# running beside them: never more than two GPU instances at a time.
on:
  workflow_call:
    inputs:
      artifact_run_id:
        description: Reuse current-app artifacts from a completed Desktop flows run (only regressions, box or yodaddy).
        type: string
        default: ''
      linux_runner:
        description: RunsOn selector for the Linux desktop runner.
        type: string
        default: runner=gpu-nvidia-desktop-linux
      windows_runner:
        description: RunsOn selector for the Windows desktop runner.
        type: string
        default: runner=gpu-nvidia-desktop-windows
      only:
        description: Run a single job id instead of all four.
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Reuse current-app artifacts from a completed Desktop flows run (only regressions, box or yodaddy).
        type: string
        default: ''
      linux_runner:
        description: >-
          RunsOn selector for the Linux desktop runner. RunsOn reads
          .github/runs-on.yml from the default branch only, so from a branch
          name the AMI inline:
          ami=ami-08dbaf8367717a9a3/family=g4dn.xlarge/spot=false
        type: string
        default: runner=gpu-nvidia-desktop-linux
      windows_runner:
        description: >-
          RunsOn selector for the Windows desktop runner, inline from a branch:
          ami=ami-0b3c82cb19d31ac1d/family=g4dn.xlarge/spot=false
        type: string
        default: runner=gpu-nvidia-desktop-windows
      only:
        description: Run a single job (job id) instead of all four.
        type: choice
        default: ''
        options:
          - ''
          - linux-mcp
          - linux-clicks
          - windows-mcp
          - windows-clicks
          - box
          - yodaddy
          - regressions

permissions:
  contents: read
  actions: read

env:
  # The flows take their binaries, media and encoder from the environment, so
  # the same scripts run on a developer's machine against a local build.
  GST_VERSION: "1.28.6"
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  FLOW_REQUESTED_REF: ${{ github.sha }}
  FLOW_PRESET: youtube-1080p
  FLOW_ENCODER: nvh264enc

jobs:
  resolve-artifacts:
    name: Resolve verified application artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run-id: ${{ steps.source.outputs.run-id }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/github-script@v7
        id: source
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ONLY: ${{ inputs.only }}
        with:
          script: |
            const source = process.env.ARTIFACT_RUN_ID;
            if (!source) {
              core.setOutput('run-id', String(context.runId));
              core.setOutput('sha', context.sha);
              return;
            }
            if (!['regressions', 'box', 'yodaddy'].includes(process.env.ONLY)) {
              throw new Error('Artifact reuse is supported only for regressions, box or yodaddy; native desktops require a fresh build.');
            }
            if (!/^[1-9][0-9]*$/.test(source)) throw new Error('artifact_run_id must be a numeric Actions run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(source)
            });
            if (run.status !== 'completed' || run.path.split('@')[0] !== '.github/workflows/desktop-flows.yml') {
              throw new Error('Source must be a completed Desktop flows run from this repository');
            }
            core.setOutput('run-id', source);
            core.setOutput('sha', run.head_sha);
            await core.summary.addHeading('Regression artifact provenance')
              .addRaw(`Harness commit: ${context.sha}\nApplication/test commit: ${run.head_sha}\nSource run: ${source}\n`)
              .write();

  build-linux:
    name: Build current Linux desktop and regression binaries (hosted, free)
    needs: resolve-artifacts
    if: inputs.artifact_run_id == '' && (inputs.only == '' || startsWith(inputs.only, 'linux') || inputs.only == 'box' || inputs.only == 'regressions')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install GStreamer (apt)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*google*.list \
                     /etc/apt/sources.list.d/*google*.sources \
                     /etc/apt/sources.list.d/*microsoft*.list \
                     /etc/apt/sources.list.d/*microsoft*.sources || true
          sudo apt-get update || sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-tools \
            pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-current-linux-ubuntu24
          prefix-key: v1-rust
          cache-workspace-crates: true

      - name: Build the current app and focused acceptance tests
        run: |
          cargo build -p subordinate -p subordinate-cli -p subordinate-mcp --message-format=json > desktop-build.json
          cargo test -p sub-ui --test empty_timeline_drop --test empty_track_menu --test media_import_app --test app_transport_sync --test playback_audio --no-run --message-format=json >> desktop-build.json
          cargo test -p subordinate-mcp --test stdio --no-run --message-format=json >> desktop-build.json
          python3 scripts/desktop/package-build.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ github.run_id }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # --------------------------------------------------------------- Linux ----
  linux-mcp:
    name: Linux desktop, MCP-only flow
    needs: build-linux
    if: inputs.only == '' || inputs.only == 'linux-mcp'
    runs-on: runs-on=${{ github.run_id }}/${{ inputs.linux_runner || 'runner=gpu-nvidia-desktop-linux' }}
    timeout-minutes: 20
    env:
      DISPLAY: ':0'
      XAUTHORITY: /run/subordinate/Xauthority
      SUBORDINATE_ENDPOINT_DIR: /tmp/subordinate-endpoint
      SUBORDINATE_CLI: ${{ github.workspace }}/dist/subordinate-cli
      FLOW_OUT: ${{ github.workspace }}/flow-out
      FLOW_WORK: /tmp/desktop-flow
      FLOW_MEDIA: /opt/subordinate/test-media/meld-4k60-excerpt-2min.mkv
      FLOW_EDITOR: ${{ github.workspace }}/dist/subordinate
      FLOW_CLI: ${{ github.workspace }}/dist/subordinate-cli
      FLOW_MCP: ${{ github.workspace }}/dist/subordinate-mcp
      FLOW_DISCOVERER: /usr/bin/gst-discoverer-1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux-${{ github.run_id }}
          path: dist
      - name: Runtime for the current Linux build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libgstreamer-plugins-bad1.0-0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools \
            gstreamer1.0-plugins-base-apps libasound2t64 libvulkan1 libxkbcommon0
          chmod +x dist/subordinate dist/subordinate-cli dist/subordinate-mcp
      - name: First-use UI and MCP regressions on this GPU
        run: python3 scripts/desktop/run-regressions.py dist


      - name: Instance, image and display facts
        run: |
          echo "runner=$RUNNER_NAME ami=${RUNS_ON_AMI_ID:-unknown}"
          . /etc/os-release && echo "os=$PRETTY_NAME"
          echo "release baked in: $(cat /opt/subordinate/RELEASE_TAG)"
          echo "FLOW_INSTALLED_RELEASE=$(cat /opt/subordinate/RELEASE_TAG)" >> "$GITHUB_ENV"
          echo "FLOW_TESTED_REF=$GITHUB_SHA" >> "$GITHUB_ENV"
          nvidia-smi
          systemctl is-active subordinate-xorg.service
          systemctl is-active subordinate-wm.service
          /usr/local/bin/subordinate-wait-for-display

      - name: The MCP-only flow
        run: python3 -u scripts/desktop/flow_mcp.py

      - name: Screenshots, logs and the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-mcp-flow-${{ github.run_id }}
          path: ${{ env.FLOW_OUT }}
          if-no-files-found: warn

  linux-clicks:
    name: Linux desktop, clicks-only flow
    # Deliberately after linux-mcp rather than beside it: the account's
    # G-family quota is two g4dn.xlarge, and windows-mcp holds the other one.
    needs: [build-linux, linux-mcp]
    if: always() && needs.build-linux.result == 'success' && (inputs.only == '' || inputs.only == 'linux-clicks')
    runs-on: runs-on=${{ github.run_id }}/${{ inputs.linux_runner || 'runner=gpu-nvidia-desktop-linux' }}
    timeout-minutes: 20
    env:
      DISPLAY: ':0'
      XAUTHORITY: /run/subordinate/Xauthority
      SUBORDINATE_ENDPOINT_DIR: /tmp/subordinate-endpoint
      SUBORDINATE_CLI: ${{ github.workspace }}/dist/subordinate-cli
      FLOW_OUT: ${{ github.workspace }}/flow-out
      FLOW_WORK: /tmp/desktop-flow
      FLOW_MEDIA: /opt/subordinate/test-media/meld-4k60-excerpt-2min.mkv
      FLOW_EDITOR: ${{ github.workspace }}/dist/subordinate
      FLOW_CLI: ${{ github.workspace }}/dist/subordinate-cli
      FLOW_MCP: ${{ github.workspace }}/dist/subordinate-mcp
      FLOW_DISCOVERER: /usr/bin/gst-discoverer-1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux-${{ github.run_id }}
          path: dist
      - name: Runtime for the current Linux build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libgstreamer-plugins-bad1.0-0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools \
            gstreamer1.0-plugins-base-apps libasound2t64 libvulkan1 libxkbcommon0
          chmod +x dist/subordinate dist/subordinate-cli dist/subordinate-mcp
      - name: First-use UI and MCP regressions on this GPU
        run: python3 scripts/desktop/run-regressions.py dist


      - name: Instance, image and display facts
        run: |
          echo "runner=$RUNNER_NAME ami=${RUNS_ON_AMI_ID:-unknown}"
          echo "release baked in: $(cat /opt/subordinate/RELEASE_TAG)"
          echo "FLOW_INSTALLED_RELEASE=$(cat /opt/subordinate/RELEASE_TAG)" >> "$GITHUB_ENV"
          echo "FLOW_TESTED_REF=$GITHUB_SHA" >> "$GITHUB_ENV"
          nvidia-smi
          /usr/local/bin/subordinate-wait-for-display

      # Native file dialogs and the accessibility tree are desktop test dependencies.
      - name: Desktop portal and accessibility bus (apt)
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            dbus-x11 libdbus-1-3 at-spi2-core python3-pyatspi \
            xdg-desktop-portal xdg-desktop-portal-gtk zenity
          dpkg -l | grep -E 'xdg-desktop-portal|at-spi2-core|pyatspi' || true

      - name: Accessibility diagnostics (never fatal)
        continue-on-error: true
        env:
          XDG_CURRENT_DESKTOP: GNOME
          XDG_SESSION_TYPE: x11
          FLOW_OUT: ${{ github.workspace }}/flow-out/diagnostics
        run: |
          set -uo pipefail
          export XDG_RUNTIME_DIR=/tmp/xdg-runtime-$(id -u)
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          mkdir -p "$FLOW_OUT"
          dbus-run-session -- sh -c '
            echo "session bus: $DBUS_SESSION_BUS_ADDRESS"
            busctl --user list 2>&1 | head -30
            gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus \
              --method org.a11y.Bus.GetAddress 2>&1 || echo "no org.a11y.Bus"
            python3 -u scripts/desktop/example.py
            echo "--- after the example ---"
            busctl --user list 2>&1 | grep -i -E "a11y|atspi" || echo "no a11y names on the bus"
          ' 2>&1 | tee "$FLOW_OUT/diagnostics.txt"

      - name: The clicks-only flow
        env:
          # The portal picks its backend from the desktop it is told it is on;
          # with only the GTK backend installed, anything GNOME-shaped selects
          # it. XDG_RUNTIME_DIR has to exist for the portal and the a11y bus.
          XDG_CURRENT_DESKTOP: GNOME
          XDG_SESSION_TYPE: x11
          GTK_A11Y: atspi
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR=/tmp/xdg-runtime-$(id -u)
          mkdir -p "$XDG_RUNTIME_DIR" "$FLOW_OUT"
          chmod 700 "$XDG_RUNTIME_DIR"
          # The portal is started explicitly rather than left to D-Bus
          # activation, so that its log is a file this job can upload: a
          # dialog that never appears is nearly always the portal refusing,
          # and it says so nowhere else.
          # zenity is rfd's own fallback when the portal call fails, so it is
          # installed too: either way the dialog that opens is the one the
          # application asked for, and the flow records which came up.
          export G_MESSAGES_DEBUG=all
          dbus-run-session -- bash -c '
            set -uo pipefail
            for portal in /usr/libexec/xdg-desktop-portal-gtk /usr/libexec/xdg-desktop-portal; do
              name=$(basename "$portal")
              "$portal" -r >"$FLOW_OUT/$name.log" 2>&1 &
              echo "started $name (pid $!)"
            done
            sleep 3
            busctl --user list | grep -i portal || echo "no portal on the bus"
            python3 -u scripts/desktop/flow_clicks.py
          '

      - name: Screenshots, logs and the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-clicks-flow-${{ github.run_id }}
          path: ${{ env.FLOW_OUT }}
          if-no-files-found: warn

  # -------------------------------------------------------------- Windows ----
  build-windows:
    name: Build current Windows desktop and regression binaries (hosted, free)
    needs: resolve-artifacts
    if: inputs.artifact_run_id == '' && (inputs.only == '' || startsWith(inputs.only, 'windows') || inputs.only == 'yodaddy' || inputs.only == 'regressions')
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install GStreamer (Windows, official installer)
        shell: pwsh
        run: |
          $ver = $env:GST_VERSION
          $exe = "gstreamer-1.0-msvc-x86_64-$ver.exe"
          $url = "https://gstreamer.freedesktop.org/data/pkg/windows/$ver/msvc/$exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          $dir = "C:\gstreamer\1.0\msvc_x86_64"
          Start-Process -Wait -FilePath ".\$exe" -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES","/TYPE=devel","/ALLUSERS","/DIR=$dir"
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$dir\lib\pkgconfig" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$dir\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-current-windows
          prefix-key: v1-rust
          cache-workspace-crates: true

      - name: Build and package the current app, tests and runtime
        shell: pwsh
        run: |
          cargo build -p subordinate -p subordinate-cli -p subordinate-mcp --message-format=json | Out-File -Encoding utf8 desktop-build.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test -p sub-ui --test empty_timeline_drop --test empty_track_menu --test media_import_app --test app_transport_sync --test playback_audio --no-run --message-format=json | Out-File -Encoding utf8 -Append desktop-build.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test -p subordinate-mcp --test stdio --no-run --message-format=json | Out-File -Encoding utf8 -Append desktop-build.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/desktop/package-build.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $gst = $env:GSTREAMER_1_0_ROOT_MSVC_X86_64
          New-Item -ItemType Directory -Force dist/runtime/lib/gstreamer-1.0, dist/runtime/libexec | Out-Null
          Copy-Item "$gst/bin" dist/runtime/bin -Recurse
          Copy-Item "$gst/lib/gstreamer-1.0/*.dll" dist/runtime/lib/gstreamer-1.0/
          Copy-Item "$gst/libexec/*" dist/runtime/libexec/ -Recurse
          # A private Python avoids the Store alias and installs nothing on yodaddy.
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.12.7/python-3.12.7-embed-amd64.zip' -OutFile python.zip
          Expand-Archive python.zip dist/python
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ github.run_id }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  windows-mcp:
    name: Windows desktop, MCP-only flow
    needs: build-windows
    if: inputs.only == '' || inputs.only == 'windows-mcp'
    runs-on: runs-on=${{ github.run_id }}/${{ inputs.windows_runner || 'runner=gpu-nvidia-desktop-windows' }}
    timeout-minutes: 22
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows-${{ github.run_id }}
          path: dist
      - name: Run the MCP-only flow in the console session
        uses: ./.github/actions/windows-desktop-flow
        with:
          flow: flow_mcp.py
          name: mcp

      # The same render, through the CLI and in this session rather than
      # through the bridge in the console session. It tells a stall in the
      # export path apart from a stall in how the flow drives it, and it is
      # never fatal: the flow above is the job's verdict.
      - name: Render the same project with the CLI (never fatal)
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Continue'
          $project = (Get-ChildItem 'C:\SubordinateTest\flow-project\flow-*.sub' | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          if (-not (Test-Path $project)) { 'no project to render'; exit 0 }
          $env:SUBORDINATE_LOG = 'info,sub_export=debug'
          & 'C:\SubordinateTest\current\subordinate-cli.exe' render $project `
            --preset $env:FLOW_PRESET --out "$env:RUNNER_TEMP\flow-out\cli-render.mp4" `
            --range 0:48 --encoder nvh264enc --verify 2>&1 |
            Tee-Object "$env:RUNNER_TEMP\flow-out\cli-render.log"
          "cli render exit=$LASTEXITCODE"
      - name: Screenshots, logs and the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-mcp-flow-${{ github.run_id }}
          path: ${{ runner.temp }}/flow-out
          if-no-files-found: warn

  windows-clicks:
    name: Windows desktop, clicks-only flow
    needs: [build-windows, windows-mcp]
    if: always() && needs.build-windows.result == 'success' && (inputs.only == '' || inputs.only == 'windows-clicks')
    runs-on: runs-on=${{ github.run_id }}/${{ inputs.windows_runner || 'runner=gpu-nvidia-desktop-windows' }}
    timeout-minutes: 22
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows-${{ github.run_id }}
          path: dist
      - name: Run the clicks-only flow in the console session
        uses: ./.github/actions/windows-desktop-flow
        with:
          flow: flow_clicks.py
          name: clicks
      - name: Screenshots, logs and the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-clicks-flow-${{ github.run_id }}
          path: ${{ runner.temp }}/flow-out
          if-no-files-found: warn

  box:
    name: Fresh-project UI and MCP (box, no desktop input)
    needs: [resolve-artifacts, build-linux]
    if: >-
      !cancelled() && needs.resolve-artifacts.result == 'success'
      && (inputs.artifact_run_id != '' || needs.build-linux.result == 'success')
      && (inputs.only == '' || inputs.only == 'box' || inputs.only == 'regressions')
    runs-on: [self-hosted, linux, box, amd-gpu]
    env:
      SUB_REGRESSION_ARTIFACT_SHA: ${{ needs.resolve-artifacts.outputs.sha }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux-${{ needs.resolve-artifacts.outputs.run-id }}
          path: dist
          run-id: ${{ needs.resolve-artifacts.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Offscreen UI and isolated real MCP acceptance tests
        run: python3 scripts/desktop/run-regressions.py dist

  yodaddy:
    name: Fresh-project UI and MCP (yodaddy, no desktop input)
    needs: [resolve-artifacts, build-windows]
    if: >-
      !cancelled() && needs.resolve-artifacts.result == 'success'
      && (inputs.artifact_run_id != '' || needs.build-windows.result == 'success')
      && (inputs.only == '' || inputs.only == 'yodaddy' || inputs.only == 'regressions')
    runs-on: [self-hosted, windows, yodaddy, amd-gpu]
    env:
      SUB_REGRESSION_ARTIFACT_SHA: ${{ needs.resolve-artifacts.outputs.sha }}
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows-${{ needs.resolve-artifacts.outputs.run-id }}
          path: dist
          run-id: ${{ needs.resolve-artifacts.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Offscreen UI and isolated real MCP acceptance tests
        run: |
          $env:PATH = "$pwd/dist/runtime/bin;$env:PATH"
          $env:GST_PLUGIN_PATH = "$pwd/dist/runtime/lib/gstreamer-1.0"
          $env:GST_PLUGIN_SYSTEM_PATH = $env:GST_PLUGIN_PATH
          $env:GST_PLUGIN_SCANNER = (Get-ChildItem dist/runtime/libexec -Filter gst-plugin-scanner.exe -Recurse | Select-Object -First 1).FullName
          & dist/python/python.exe scripts/desktop/run-regressions.py dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
