name: GPU smoke

# Proves the GPU runners defined in .github/runs-on.yml actually boot with a
# working GPU and a GStreamer hardware encoder element (TASK-114). Trigger by
# hand. Needs the EC2 G-family vCPU quotas in us-east-1 above zero (TASK-113);
# until those are approved the jobs fail to launch. See docs/DEVELOPMENT.md
# "GPU CI". TASK-116 turns these checks into the real hardware verification.
on:
  workflow_dispatch:

jobs:
  nvidia-linux:
    name: NVIDIA T4 (g4dn.xlarge, Ubuntu 24.04)
    runs-on: runs-on=${{ github.run_id }}/runner=gpu-nvidia-linux
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instance and GPU facts
        run: |
          echo "runner=$RUNNER_NAME"
          curl -fsS -m 3 http://169.254.169.254/latest/meta-data/instance-type || true; echo
          . /etc/os-release && echo "os=$PRETTY_NAME"
          nvidia-smi

      # ubuntu24-gpu-x64 is Ubuntu 24.04, whose apt GStreamer is 1.24 - one
      # minor below the 1.28 pin shared by ci.yml and docs/DEVELOPMENT.md. That
      # is fine for an element-presence smoke test (the nvcodec plugin in
      # gstreamer1.0-plugins-bad has shipped nvh264enc since well before 1.24),
      # so this job reports the version instead of enforcing it. TASK-116 must
      # either build 1.28 here or move to a custom 26.04 GPU image.
      - name: Install GStreamer (apt)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*google*.list \
                     /etc/apt/sources.list.d/*google*.sources \
                     /etc/apt/sources.list.d/*microsoft*.list \
                     /etc/apt/sources.list.d/*microsoft*.sources || true
          sudo apt-get update || sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x pkg-config \
            libasound2-dev
          echo "gstreamer-1.0 = $(pkg-config --modversion gstreamer-1.0)"

      - name: NVENC element present
        run: |
          gst-inspect-1.0 --exists nvh264enc \
            || { echo "::error::nvh264enc missing"; gst-inspect-1.0 nvcodec || true; exit 1; }
          gst-inspect-1.0 nvh264enc | head -20

  amd-linux:
    # AWS no longer offers AMD GPU instances (g4ad retired), so the AMD Linux
    # target runs on "box", a user-owned mini PC with an AMD Cezanne APU
    # (Radeon Vega, VCN encode) registered as a self-hosted runner. Zero cost.
    # Packages (GStreamer 1.28 from Ubuntu 26.04, mesa-va-drivers, vainfo) are
    # preinstalled on the box; this job verifies rather than installs.
    name: AMD APU (box, self-hosted, Ubuntu 26.04)
    runs-on: [self-hosted, linux, box, amd-gpu]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Host and DRM facts
        run: |
          echo "runner=$RUNNER_NAME"
          . /etc/os-release && echo "os=$PRETTY_NAME"
          ls -l /dev/dri
          lspci -nn | grep -i -E 'vga|display' || true
          id -nG

      - name: GStreamer and VA-API facts
        env:
          GST_MINOR: "1.28"
        run: |
          gst-inspect-1.0 --version
          v=$(pkg-config --modversion gstreamer-1.0); echo "gstreamer-1.0 = $v"
          case "$v" in "$GST_MINOR".*) ;; *) echo "::error::expected GStreamer $GST_MINOR.x, got $v"; exit 1;; esac
          vainfo --display drm --device /dev/dri/renderD128 | grep -E 'Driver version|EncSlice'

      - name: VA-API encoder elements present
        run: |
          for e in vah264enc vah265enc vah264dec vapostproc; do
            gst-inspect-1.0 --exists "$e" && echo "present  $e" || { echo "::error::$e missing"; exit 1; }
          done

      - name: Hardware H.264 encode round-trip
        run: |
          gst-launch-1.0 -q videotestsrc num-buffers=120 ! video/x-raw,width=1920,height=1080,framerate=30/1 \
            ! vapostproc ! vah264enc ! h264parse ! mp4mux ! filesink location="$RUNNER_TEMP/va-test.mp4"
          gst-discoverer-1.0 "$RUNNER_TEMP/va-test.mp4" | tee /dev/stderr | grep -q 'H.264'
          ls -l "$RUNNER_TEMP/va-test.mp4"
