name: GPU smoke

# Proves the GPU runners defined in .github/runs-on.yml actually boot with a
# working GPU and a GStreamer hardware encoder element (TASK-114). Trigger by
# hand. Needs the EC2 G-family vCPU quotas in us-east-1 above zero (TASK-113);
# until those are approved the jobs fail to launch. See docs/DEVELOPMENT.md
# "GPU CI". TASK-116 turns these checks into the real hardware verification.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run a single job (job id) instead of all of them'
        type: choice
        default: ''
        options:
          - ''
          - nvidia-linux
          - nvidia-desktop-linux
          - amd-linux
          - nvidia-windows
          - amd-windows
      desktop_runner:
        description: >-
          RunsOn selector for nvidia-desktop-linux. RunsOn reads
          .github/runs-on.yml from the default branch only, so a new or
          changed AMI has to be spelled out inline until it is merged.
          Note the key is `ami=`, not `image=`: `image=` takes the *name* of
          a built-in or configured image and rejects a raw id with
          "not found in default images or repo config".
          ami=ami-0123.../family=g4dn.xlarge/spot=false
        type: string
        default: runner=gpu-nvidia-desktop-linux

jobs:
  nvidia-linux:
    name: NVIDIA T4 (g4dn.xlarge, Ubuntu 24.04)
    if: inputs.only == '' || inputs.only == 'nvidia-linux'
    runs-on: runs-on=${{ github.run_id }}/runner=gpu-nvidia-linux
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instance and GPU facts
        run: |
          echo "runner=$RUNNER_NAME"
          curl -fsS -m 3 http://169.254.169.254/latest/meta-data/instance-type || true; echo
          . /etc/os-release && echo "os=$PRETTY_NAME"
          nvidia-smi

      # ubuntu24-gpu-x64 is Ubuntu 24.04, whose apt GStreamer is 1.24 - one
      # minor below the 1.28 pin shared by ci.yml and docs/DEVELOPMENT.md. That
      # is fine for an element-presence smoke test (the nvcodec plugin in
      # gstreamer1.0-plugins-bad has shipped nvh264enc since well before 1.24),
      # so this job reports the version instead of enforcing it. TASK-116 must
      # either build 1.28 here or move to a custom 26.04 GPU image.
      - name: Install GStreamer (apt)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*google*.list \
                     /etc/apt/sources.list.d/*google*.sources \
                     /etc/apt/sources.list.d/*microsoft*.list \
                     /etc/apt/sources.list.d/*microsoft*.sources || true
          sudo apt-get update || sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x pkg-config \
            libasound2-dev
          echo "gstreamer-1.0 = $(pkg-config --modversion gstreamer-1.0)"

      - name: NVENC element present
        run: |
          gst-inspect-1.0 --exists nvh264enc \
            || { echo "::error::nvh264enc missing"; gst-inspect-1.0 nvcodec || true; exit 1; }
          gst-inspect-1.0 nvh264enc | head -20

  nvidia-desktop-linux:
    # The desktop image (TASK-137): the same T4 instance, but booted into a
    # real Xorg session on the NVIDIA driver instead of a bare console, with
    # Subordinate, subordinate-mcp and the 4K60 test clip already installed.
    # Nothing is downloaded or compiled here - if a step needs to install
    # something, it belongs in infra/images/linux-desktop/component.yaml, not
    # in this job.
    name: NVIDIA T4 desktop (g4dn.xlarge, Xorg on :0)
    if: inputs.only == '' || inputs.only == 'nvidia-desktop-linux'
    runs-on: runs-on=${{ github.run_id }}/${{ inputs.desktop_runner || 'runner=gpu-nvidia-desktop-linux' }}
    timeout-minutes: 30
    env:
      # The Actions runner is started by the RunsOn bootstrap, which reads no
      # login profile, so the image's /etc/profile.d never reaches these steps.
      DISPLAY: ':0'
      XAUTHORITY: /run/subordinate/Xauthority
      # Which headless engine the MCP bridge launches when it finds no editor
      # listening. On the image the CLI is a wrapper in /usr/local/bin rather
      # than a binary beside subordinate-mcp, so it has to be named.
      SUBORDINATE_CLI: /usr/local/bin/subordinate-cli
    steps:
      - uses: actions/checkout@v4

      - name: Instance, image and GPU facts
        run: |
          echo "runner=$RUNNER_NAME ami=${RUNS_ON_AMI_ID:-unknown}"
          curl -fsS -m 3 http://169.254.169.254/latest/meta-data/instance-type || true; echo
          . /etc/os-release && echo "os=$PRETTY_NAME"
          echo "release baked in: $(cat /opt/subordinate/RELEASE_TAG)"
          nvidia-smi

      - name: Xorg session is up on :0
        run: |
          systemctl is-active subordinate-xorg.service
          systemctl is-active subordinate-wm.service
          /usr/local/bin/subordinate-wait-for-display
          # Captured rather than piped into grep twice: `xdpyinfo | grep -q`
          # leaves xdpyinfo with a SIGPIPE, which any shell with pipefail on
          # reports as a failure of a check that actually passed.
          info=$(xdpyinfo -display :0)
          echo "$info" | grep -E 'name of display|dimensions|depth of root' || true
          case "$info" in
            *1920x1080*) ;;
            *) echo "::error::the virtual screen is not 1920x1080"; exit 1 ;;
          esac

      # --ui-smoke opens the committed sample project, pops the viewer out and
      # holds both windows up while it prints a ready line naming what it
      # painted. The hold is what the screenshot and the window queries below
      # happen inside; the app closes itself afterwards either way.
      - name: Editor on the real display
        id: editor
        run: |
          set -o pipefail
          out="$RUNNER_TEMP/desktop-smoke"
          mkdir -p "$out"
          echo "out=$out" >>"$GITHUB_OUTPUT"
          # setsid + nohup: the window has to outlive this step, because the
          # screenshot, the window queries and the MCP round-trip are separate
          # steps and each one gets its own shell.
          # The pop-out is placed in the bottom-right corner rather than left
          # where it lands by default, where it covers the editor's own bar -
          # and that bar is where the adapter is named, which is the thing the
          # screenshot is taken to show.
          setsid nohup subordinate --ui-smoke --hold-seconds 300 \
            --popout-position 940,520 \
            crates/sub-model/tests/fixtures/sample-project.sub >"$out/app.log" 2>&1 &
          echo "app_pid=$!" >>"$GITHUB_OUTPUT"
          for _ in $(seq 1 120); do
            grep -q 'ui-smoke ready' "$out/app.log" && break
            sleep 1
          done
          if ! grep -q 'ui-smoke ready' "$out/app.log"; then
            echo "::error::the editor never reported ui-smoke ready"
            cat "$out/app.log"
            exit 1
          fi
          grep 'ui-smoke ready' "$out/app.log"

      - name: Window, screenshot and adapter
        run: |
          set -o pipefail
          out="${{ steps.editor.outputs.out }}"
          # xdotool proves the window exists to another X client, which is the
          # thing a human-style test will drive later (TASK-139).
          xdotool search --name 'Subordinate' | tee "$out/window-ids.txt"
          [ -s "$out/window-ids.txt" ] \
            || { echo "::error::no window named Subordinate on :0"; exit 1; }
          for id in $(cat "$out/window-ids.txt"); do
            xwininfo -id "$id" | sed -n 's/^ *\(xwininfo\|Absolute\|Width\|Height\|Window id\)/\1/p'
          done | tee "$out/windows.txt"
          xwininfo -root -tree >"$out/window-tree.txt"
          # Raise the editor so its own bar - the one naming the adapter - is
          # what the picture shows, rather than whatever the window manager
          # happened to stack on top.
          xdotool search --name '^Subordinate$' windowactivate --sync windowraise || true
          scrot -o "$out/display0.png"
          identify "$out/display0.png" | tee -a "$GITHUB_STEP_SUMMARY"

          # The adapter the editor actually got. It is printed once at startup
          # and shown in the app's own bar, which is what the screenshot
          # carries; this is the machine-readable half of the same fact.
          line=$(grep -m1 'render device ready on' "$out/app.log") \
            || { echo "::error::the editor never logged its render device"; exit 1; }
          echo "$line" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$line" in
            *"render device ready on Vulkan"*) ;;
            *) echo "::error::expected a Vulkan adapter: $line"; exit 1 ;;
          esac
          case "$line" in
            *"(software,"*|*llvmpipe*|*lavapipe*|*SwiftShader*)
              echo "::error::the editor fell back to software rendering: $line"; exit 1 ;;
          esac
          if grep -q 'falling back to software rendering' "$out/app.log"; then
            echo "::error::the editor fell back to software rendering"; exit 1
          fi

      - name: Baked-in test media probes
        run: |
          set -o pipefail
          media=$(ls /opt/subordinate/test-media/* | head -n1)
          echo "media=$media"
          ls -l "$media"
          # The bundled GStreamer 1.28 inside the AppImage, not the host's apt
          # 1.24: this is the runtime the editor itself decodes with.
          subordinate-gst-discoverer "$media" | tee "${{ steps.editor.outputs.out }}/probe.txt"
          grep -qi 'video' "${{ steps.editor.outputs.out }}/probe.txt"

      # The editor does not bind the Command API endpoint yet, so the bridge
      # starts `subordinate-cli serve` - the same engine and the same
      # dispatcher with nothing drawn - and speaks to that. The round-trip is
      # still the real one: mutations go over the socket and the timeline that
      # comes back is the one they produced, while the editor window is up on
      # :0 beside it.
      #
      # `project.new` on its own cannot demonstrate a read: the project it
      # creates is empty, and `timeline.get_state` then fails - correctly -
      # with `the project has no sequences` (run 34661369585). Opening the
      # committed sample project instead fails just as correctly with `the
      # project has more than one sequence, so one must be named` (run
      # 34663392571). So the chain makes exactly one sequence and reads that
      # one: new project, create a sequence in it, read the timeline back.
      - name: MCP round-trip while the window is up
        run: |
          set -o pipefail
          out="${{ steps.editor.outputs.out }}"
          settings='{"resolution":{"width":1920,"height":1080},'
          settings+='"frame_rate":{"numerator":24000,"denominator":1001},'
          settings+='"sample_rate":48000,'
          settings+='"color":{"space":"rec709","transfer":"bt709","primaries":"bt709"}}'
          # timeout, because a stdio bridge that never answers would otherwise
          # hold a GPU instance open until the job's own 30-minute limit.
          timeout 180 python3 scripts/mcp-roundtrip.py --mcp /usr/local/bin/subordinate-mcp \
            'project.new={"name":"Desktop smoke"}' \
            "sequence.create={\"name\":\"Main\",\"settings\":$settings}" \
            'timeline.get_state={}' \
            | tee "$out/mcp.txt"
          grep -q '^timeline.get_state: ' "$out/mcp.txt"
          # The window is still the one that was photographed.
          xdotool search --name 'Subordinate' >/dev/null

      - name: Stop the editor
        if: always()
        run: kill "${{ steps.editor.outputs.app_pid }}" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-${{ github.sha }}
          path: ${{ steps.editor.outputs.out }}
          if-no-files-found: warn

  amd-linux:
    # AWS no longer offers AMD GPU instances (g4ad retired), so the AMD Linux
    # target runs on "box", a user-owned mini PC with an AMD Cezanne APU
    # (Radeon Vega, VCN encode) registered as a self-hosted runner. Zero cost.
    # Packages (GStreamer 1.28 from Ubuntu 26.04, mesa-va-drivers, vainfo) are
    # preinstalled on the box; this job verifies rather than installs.
    name: AMD APU (box, self-hosted, Ubuntu 26.04)
    if: inputs.only == '' || inputs.only == 'amd-linux'
    runs-on: [self-hosted, linux, box, amd-gpu]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Host and DRM facts
        run: |
          echo "runner=$RUNNER_NAME"
          . /etc/os-release && echo "os=$PRETTY_NAME"
          ls -l /dev/dri
          lspci -nn | grep -i -E 'vga|display' || true
          id -nG

      - name: GStreamer and VA-API facts
        env:
          GST_MINOR: "1.28"
        run: |
          gst-inspect-1.0 --version
          v=$(pkg-config --modversion gstreamer-1.0); echo "gstreamer-1.0 = $v"
          case "$v" in "$GST_MINOR".*) ;; *) echo "::error::expected GStreamer $GST_MINOR.x, got $v"; exit 1;; esac
          vainfo --display drm --device /dev/dri/renderD128 | grep -E 'Driver version|EncSlice'

      - name: VA-API encoder elements present
        run: |
          for e in vah264enc vah265enc vah264dec vapostproc; do
            gst-inspect-1.0 --exists "$e" && echo "present  $e" || { echo "::error::$e missing"; exit 1; }
          done

      - name: Hardware H.264 encode round-trip
        run: |
          gst-launch-1.0 -q videotestsrc num-buffers=120 ! video/x-raw,width=1920,height=1080,framerate=30/1 \
            ! vapostproc ! vah264enc ! h264parse ! mp4mux ! filesink location="$RUNNER_TEMP/va-test.mp4"
          gst-discoverer-1.0 "$RUNNER_TEMP/va-test.mp4" | tee /dev/stderr | grep -q 'H.264'
          ls -l "$RUNNER_TEMP/va-test.mp4"

  nvidia-windows:
    # No custom AMI (TASK-115). RunsOn's stock `windows22-full-x64` image runs
    # on a g4dn instance perfectly well, it just ships without an NVIDIA
    # driver; this job installs the AWS-published one at the start of the run,
    # in about 100 seconds, from the anonymously readable bucket
    # s3://ec2-windows-nvidia-drivers. `-s -n` is silent + no reboot, which is
    # mandatory here: a RunsOn runner is ephemeral and would never come back
    # from a restart. The driver loads immediately for NVENC without one -
    # nvidia-smi and nvh264enc both work in the same job.
    name: NVIDIA T4 (g4dn.xlarge, Windows Server 2022)
    if: inputs.only == '' || inputs.only == 'nvidia-windows'
    runs-on: runs-on=${{ github.run_id }}/runner=gpu-nvidia-windows
    timeout-minutes: 20
    env:
      GST_VERSION: "1.28.6"
      GST_MINOR: "1.28"
    steps:
      - uses: actions/checkout@v4

      - name: Instance facts
        shell: pwsh
        run: |
          "runner=$env:RUNNER_NAME"
          try {
            $t = Invoke-RestMethod -Method Put -Uri http://169.254.169.254/latest/api/token `
                   -Headers @{'X-aws-ec2-metadata-token-ttl-seconds'='60'} -TimeoutSec 3
            $h = @{'X-aws-ec2-metadata-token'=$t}
            "instance-type=" + (Invoke-RestMethod -Uri http://169.254.169.254/latest/meta-data/instance-type -Headers $h -TimeoutSec 3)
            "lifecycle=" + (Invoke-RestMethod -Uri http://169.254.169.254/latest/meta-data/instance-life-cycle -Headers $h -TimeoutSec 3)
          } catch { "imds unavailable: $_" }
          (Get-CimInstance Win32_OperatingSystem).Caption
          Get-CimInstance Win32_VideoController | Format-List Name, DriverVersion, AdapterRAM

      - name: Install NVIDIA driver (AWS public bucket, no reboot)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $bucket = "https://ec2-windows-nvidia-drivers.s3.amazonaws.com"

          # The bucket is world-readable AND world-listable over plain HTTPS, so
          # no AWS credentials are involved. That matters: the RunsOn instance
          # role is scoped to the stack's own buckets, so the `aws s3 cp` the
          # AWS docs suggest fails here with AccessDenied on ListObjectsV2
          # (verified, run 34617932919).
          [xml]$list = (Invoke-WebRequest -UseBasicParsing "$bucket/?list-type=2&prefix=latest/").Content
          $key = $list.ListBucketResult.Contents |
                 Where-Object { $_.Key -like "*.exe" } |
                 Sort-Object Key -Descending | Select-Object -First 1 -ExpandProperty Key
          if (-not $key) { throw "no .exe under s3://ec2-windows-nvidia-drivers/latest/" }
          $exe = Join-Path $env:RUNNER_TEMP (Split-Path $key -Leaf)
          "driver=$key"

          # curl.exe ships with Windows and is much faster than
          # Invoke-WebRequest for a 750 MB file.
          curl.exe -sS -L -o "$exe" "$bucket/$key"
          if ($LASTEXITCODE -ne 0) { throw "driver download failed ($LASTEXITCODE)" }
          $dl = $sw.Elapsed.TotalSeconds
          "downloaded {0:N0} MB in {1:N0}s" -f ((Get-Item $exe).Length / 1MB), $dl

          # -s silent, -n no reboot. Exit 0 = installed; 1/1641/3010 mean the
          # installer would *like* a reboot, which NVENC does not need - and a
          # RunsOn runner could not survive one anyway. Anything else is a
          # real failure.
          $p = Start-Process -Wait -PassThru -FilePath $exe -ArgumentList "-s","-n"
          "installer exit code = $($p.ExitCode)"
          if ($p.ExitCode -notin 0,1,1641,3010) { throw "driver install failed ($($p.ExitCode))" }
          $sw.Stop()
          "::notice::NVIDIA driver ready in {0:N0}s total (download {1:N0}s, install {2:N0}s)" -f $sw.Elapsed.TotalSeconds, $dl, ($sw.Elapsed.TotalSeconds - $dl)

      - name: nvidia-smi
        shell: pwsh
        run: |
          $smi = "$env:SystemRoot\System32\nvidia-smi.exe"
          if (-not (Test-Path $smi)) { $smi = "nvidia-smi" }
          & $smi
          if ($LASTEXITCODE -ne 0) { throw "nvidia-smi failed ($LASTEXITCODE)" }

      - name: Install GStreamer (Windows, official installer)
        shell: pwsh
        run: |
          $ver = $env:GST_VERSION
          $exe = "gstreamer-1.0-msvc-x86_64-$ver.exe"
          $url = "https://gstreamer.freedesktop.org/data/pkg/windows/$ver/msvc/$exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          $dir = "C:\gstreamer\1.0\msvc_x86_64"
          Start-Process -Wait -FilePath ".\$exe" -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES","/TYPE=devel","/ALLUSERS","/DIR=$dir"
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$dir\lib\pkgconfig" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$dir\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Hardware encoder elements present
        shell: pwsh
        run: |
          gst-inspect-1.0 --version
          $v = (pkg-config --modversion gstreamer-1.0)
          "gstreamer-1.0 = $v"
          if (-not $v.StartsWith("$env:GST_MINOR.")) {
            "::error::expected GStreamer $env:GST_MINOR.x, got $v"
            exit 1
          }
          $fail = $false
          foreach ($e in @("nvh264enc","mfh264enc")) {
            gst-inspect-1.0 --exists $e
            if ($LASTEXITCODE -eq 0) { "present  $e" } else { "::error::$e missing"; $fail = $true }
          }
          if ($fail) {
            gst-inspect-1.0 nvcodec
            gst-inspect-1.0 mediafoundation
            exit 1
          }
          gst-inspect-1.0 nvh264enc | Select-Object -First 20

  amd-windows:
    # AWS has no AMD GPU instances, so AMF (AMD Windows) runs on "yodaddy", the
    # user's own Windows 11 desktop (Radeon RX 9070 XT, two monitors) registered
    # as a self-hosted runner. It is a daily-use machine: keep this job short,
    # install nothing system-wide (GStreamer goes per-user under LOCALAPPDATA),
    # and leave no processes behind. Zero cost.
    name: AMD RX 9070 XT (yodaddy, self-hosted, Windows 11)
    if: inputs.only == '' || inputs.only == 'amd-windows'
    runs-on: [self-hosted, windows, yodaddy, amd-gpu]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    env:
      GST_VERSION: "1.28.6"
    steps:
      - name: Host and GPU facts
        run: |
          "runner=$env:RUNNER_NAME"
          (Get-CimInstance Win32_OperatingSystem).Caption
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-Table -AutoSize | Out-String -Width 120
          "monitors=" + (Get-CimInstance Win32_DesktopMonitor | Measure-Object).Count

      - name: Install GStreamer per-user if missing
        run: |
          $dir = "$env:LOCALAPPDATA\gstreamer\1.0\msvc_x86_64"
          if (-not (Test-Path "$dir\bin\gst-inspect-1.0.exe")) {
            $ProgressPreference = 'SilentlyContinue'
            $name = "gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.exe"
            $exe = "$env:RUNNER_TEMP\$name"
            Invoke-WebRequest -UseBasicParsing -Uri "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc/$name" -OutFile $exe
            $p = Start-Process -Wait -PassThru -FilePath $exe -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES","/CURRENTUSER","/TYPE=devel","/DIR=$dir"
            "installer exit $($p.ExitCode)"
            Remove-Item $exe -ErrorAction SilentlyContinue
          } else { "already installed" }
          "$dir\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "GST_DIR=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: AMF and Media Foundation encoder elements
        run: |
          gst-inspect-1.0 --version
          foreach ($e in 'amfh264enc','amfh265enc','amfav1enc','mfh264enc','x264enc') {
            gst-inspect-1.0 --exists $e; if ($LASTEXITCODE -eq 0) { "present  $e" } else { "absent   $e" }
          }
          gst-inspect-1.0 --exists amfh264enc; if ($LASTEXITCODE -ne 0) { Write-Error "amfh264enc missing"; exit 1 }

      - name: Hardware H.264 encode round-trip (AMF)
        run: |
          $out = "$env:RUNNER_TEMP\amf-test.mp4"
          # Windows PowerShell turns native stderr into a terminating error, so run
          # the pipeline through cmd with both streams captured to a log file.
          $log = "$env:RUNNER_TEMP\amf-test.log"
          $env:GST_DEBUG = "2,amf*:4"
          $outFwd = $out -replace '\\', '/'
          $logFwd = $log -replace '\\', '/'
          cmd /c "gst-launch-1.0 videotestsrc num-buffers=120 ! video/x-raw,width=1920,height=1080,framerate=30/1 ! amfh264enc ! video/x-h264 ! h264parse ! mp4mux ! filesink location=$outFwd > $logFwd 2>&1"
          "gst-launch exit $LASTEXITCODE"
          Remove-Item Env:GST_DEBUG
          Get-Content $log | Select-Object -Last 30
          Get-ChildItem $env:RUNNER_TEMP | Select-Object Name, Length | Format-Table -AutoSize | Out-String -Width 120
          if (Test-Path $out) { "size " + (Get-Item $out).Length } else { "no output file"; exit 1 }
          cmd /c "gst-discoverer-1.0 `"$out`" 2>&1" | Tee-Object -Variable info
          if (-not ($info -match 'H\.264')) { Write-Error "no H.264 stream"; exit 1 }
          (Get-Item $out).Length
          Remove-Item $out -ErrorAction SilentlyContinue
