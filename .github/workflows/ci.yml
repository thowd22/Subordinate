name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backlog/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'backlog/**'
      - 'docs/**'
      - '**.md'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # ---- CI-only build tuning (TASK-125) ----
  # None of this lives in Cargo.toml or .cargo/config.toml, so a local
  # `cargo build` behaves exactly as before; see docs/DEVELOPMENT.md,
  # "CI build speed". Full debuginfo is what makes the MSVC link step and the
  # .pdb writes dominate the Windows job; line tables keep the file and line
  # numbers in RUST_BACKTRACE output at a fraction of the size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # Pinned GStreamer release. All three OSes must stay on the same minor (1.28).
  # Linux comes from Ubuntu 26.04 apt (1.28.x); Windows and macOS use the
  # official binaries at this exact version. Keep docs/DEVELOPMENT.md in sync.
  GST_VERSION: "1.28.6"
  GST_MINOR: "1.28"

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows is the slowest of the three and used to be the one that hit the
    # limit: half the runs on main were cancelled at 60, so it was given 90 as
    # a stopgap. The cause was never a hang -- it was the test and smoke-test
    # steps recompiling the workspace two more times, see the Test step below
    # (TASK-131). With that gone a Windows job is about 13 minutes warm and
    # about 20 cold, so 40 is back: high enough for a cold cache and a slow
    # GStreamer download, low enough to still catch a genuine hang.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Toolchain version mirrors rust-toolchain.toml. wasm32-wasip2 is what
      # plugin components are built for; without it the WASM tests in
      # spikes/wasm-command-world compile out silently (TASK-9).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
          targets: wasm32-wasip2

      # The one compilation cache for every job (TASK-126). sccache used to run
      # alongside this on some or all runners; it is gone, on every OS.
      #
      # Both caches store the same artifacts in the same backend -- the 10 GB
      # per-repository Actions cache -- but they store them very differently.
      # rust-cache writes one large archive per OS; sccache's GitHub Actions
      # backend writes one entry per compiled object. After TASK-125 the
      # repository held 1080 entries totalling 10.4 GB, of which all but two
      # were `sccache/...` objects of a few MB each. Actions evicts
      # least-recently-used entries once a repository is over budget, so the
      # large rust-cache archives were the first things to go and nearly every
      # job started with a cold target directory: Linux went from about 5
      # minutes to 13 (331 rustc invocations, 164 sccache hits against 167
      # misses) and Windows eventually hit the 40-minute timeout outright.
      #
      # rust-cache alone is the configuration that measured 5 minutes on Linux
      # and it keeps the whole repository inside a handful of entries. The
      # sccache entries already in the repository cache have to be deleted by
      # hand once -- see docs/DEVELOPMENT.md, "CI build speed".
      # `save-if` restricts writes to main: pull requests restore main's
      # archive but never add an entry of their own, so the entry count stays
      # at one archive per OS instead of one per branch per OS.
      #
      # `cache-workspace-crates` is not the default and is deliberate. Left off,
      # rust-cache strips this repository's own crates out of `target/` before
      # saving and keeps only third-party dependencies, so a warm no-change run
      # still recompiled all twenty-odd workspace members plus their test
      # binaries: 184 s of Build and 48 s of Clippy out of a 10m47s Linux job on
      # rerun 34495825617. Cargo's fingerprints decide what is stale, so keeping
      # the workspace artifacts is safe; it costs a larger archive per OS, which
      # the sccache removal above freed up room for.
      #
      # `prefix-key` is bumped whenever the *contents* an archive should hold
      # change, and it is load-bearing. Actions cache entries are immutable and
      # rust-cache refuses to re-save a key it restored as a full match ("Cache
      # up-to-date." in the post step), while its key is derived only from the
      # toolchain, the lockfile and the environment -- not from this action's
      # own inputs. So turning `cache-workspace-crates` on did nothing: every
      # run kept restoring the archive written *before* the option existed, one
      # with the workspace crates already stripped out, and kept recompiling all
      # twenty-odd members. Warm no-change rerun of run 34560385094 (attempt 2),
      # ubuntu-26.04, 12m15s: Build 184 s and Test 203 s, the same numbers as
      # the changed-source run before it. Bumping the prefix forces one fresh
      # archive per OS, written with the workspace artifacts in it; the run
      # after that is the first genuinely warm one.
      #
      # `workspaces` lists every cargo workspace in the repository, not just the
      # root one. The plugins are each self-contained workspaces with their own
      # target directories, which the root entry never covered, so their CI
      # steps rebuilt from scratch every run (cut-silence 30 s, color 31 s,
      # otio 43 s on the rerun above; only plugins/gain was listed here, and it
      # is the cheapest of the four). Keep this list equal to the set of
      # `working-directory:` values used by the plugin steps below.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspace-crates: true
          workspaces: |
            .
            plugins/color
            plugins/cut-silence
            plugins/gain
            plugins/otio

      # Defender scans every object file cargo and the MSVC linker write under
      # target\, which is the other half of the Windows penalty. The hosted
      # runner user is an administrator, so the job can set the exclusions
      # itself. Best effort only: never fail the build over it.
      - name: Exclude build directories from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @("${{ github.workspace }}", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup")
          foreach ($p in $paths) {
            if (-not $p) { continue }
            try { Add-MpPreference -ExclusionPath $p -ErrorAction Stop; Write-Host "excluded $p" }
            catch { Write-Host "could not exclude ${p}: $($_.Exception.Message)" }
          }
          try { Add-MpPreference -ExclusionProcess "rustc.exe","link.exe" -ErrorAction Stop }
          catch { Write-Host "could not exclude processes: $($_.Exception.Message)" }

      # ---------------- GStreamer (TASK-1.3) ----------------
      # The 26.04 mirror can be slow (300 MB at ~350 kB/s was observed), so the
      # downloaded .deb archives are cached and reused across runs.
      - name: Restore apt archive cache (Linux)
        if: runner.os == 'Linux'
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-gst-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      # gstreamer1.0-x carries the pango plugin (timeoverlay), which the fixture
      # pipelines need for the timecode burn-in; no other package pulls it in.
      - name: Install GStreamer (Linux, apt)
        if: runner.os == 'Linux'
        run: |
          if [ -d ~/apt-archives ]; then sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true; fi
          # The runner image carries third-party repositories we never install
          # from (Chrome, Microsoft). Their indexes have been seen to serve a
          # stale hash, which fails `apt-get update` as a whole and takes the
          # build down with it. Drop them, then retry once for transient
          # mirror errors.
          sudo rm -f /etc/apt/sources.list.d/*google*.list \
                     /etc/apt/sources.list.d/*google*.sources \
                     /etc/apt/sources.list.d/*microsoft*.list \
                     /etc/apt/sources.list.d/*microsoft*.sources || true
          sudo apt-get update || sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 -o APT::Keep-Downloaded-Packages=true \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x pkg-config \
            libasound2-dev
          v=$(pkg-config --modversion gstreamer-1.0)
          echo "gstreamer-1.0 = $v"
          case "$v" in "$GST_MINOR".*) ;; *) echo "::error::expected GStreamer $GST_MINOR.x, got $v"; exit 1;; esac
          mkdir -p ~/apt-archives && sudo cp /var/cache/apt/archives/*.deb ~/apt-archives/ && sudo chown -R "$USER" ~/apt-archives

      - name: Install GStreamer (Windows, official installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = $env:GST_VERSION
          $exe = "gstreamer-1.0-msvc-x86_64-$ver.exe"
          $url = "https://gstreamer.freedesktop.org/data/pkg/windows/$ver/msvc/$exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          $dir = "C:\gstreamer\1.0\msvc_x86_64"
          Start-Process -Wait -FilePath ".\$exe" -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES","/TYPE=devel","/ALLUSERS","/DIR=$dir"
          # The 1.28 installer does not reliably set the root variable; set everything explicitly.
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$dir\lib\pkgconfig" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # GStreamer's own pkg-config.exe must win over any other on PATH.
          "$dir\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install GStreamer (macOS, official pkg)
        if: runner.os == 'macOS'
        run: |
          base="https://gstreamer.freedesktop.org/data/pkg/osx/$GST_VERSION"
          curl -fsSLO "$base/gstreamer-1.0-$GST_VERSION-universal.pkg"
          curl -fsSLO "$base/gstreamer-1.0-devel-$GST_VERSION-universal.pkg"
          sudo installer -pkg "gstreamer-1.0-$GST_VERSION-universal.pkg" -target /
          sudo installer -pkg "gstreamer-1.0-devel-$GST_VERSION-universal.pkg" -target /
          fw=/Library/Frameworks/GStreamer.framework/Versions/1.0
          echo "PKG_CONFIG_PATH=$fw/lib/pkgconfig" >> "$GITHUB_ENV"
          # rpath for test binaries is set in .cargo/config.toml; this covers tools run directly.
          echo "DYLD_FALLBACK_LIBRARY_PATH=$fw/lib" >> "$GITHUB_ENV"
          echo "$fw/bin" >> "$GITHUB_PATH"

      - name: GStreamer diagnostics
        shell: bash
        run: |
          gst-inspect-1.0 --version
          echo "pkg-config gstreamer-1.0: $(pkg-config --modversion gstreamer-1.0)"
          echo "::group::Encoder elements"
          for e in x264enc x265enc nvh264enc nvh265enc nvav1enc vah264enc vah265enc amfh264enc amfh265enc mfh264enc mfh265enc vtenc_h264 vtenc_h265; do
            if gst-inspect-1.0 --exists "$e"; then echo "present  $e"; else echo "absent   $e"; fi
          done
          echo "::endgroup::"
          echo "::group::All encoders"
          gst-inspect-1.0 | grep -i 'Codec/Encoder' || true
          echo "::endgroup::"
      # -------------------------------------------------------

      # ---------------- Test media fixtures (TASK-10) ----------------
      # Fixtures are synthesised, never committed, and synthesising them is
      # pure x264 encode time: 16 s for the short set and a further 129 s for
      # the 10-minute long-GOP clip on Linux, measured on rerun 34495825617.
      # Nothing about that output depends on the commit, only on the generator
      # script and the GStreamer version, so both go in one cache entry per OS
      # keyed on exactly those two things (TASK-126). A `--long` run on Linux
      # puts the long clip in the same entry; Windows and macOS never generate
      # it, and `runner.os` keeps their entries separate.
      #
      # Restore-only on pull requests, mirroring rust-cache above: one archive
      # per OS, never one per branch per OS. A partial or empty restore is
      # safe -- gen-fixtures.sh keeps whatever is already on disk and
      # regenerates only what is missing, and always rewrites manifest.json.
      - name: Restore the fixture cache
        id: fixture-cache
        uses: actions/cache/restore@v4
        with:
          path: fixtures
          key: fixtures-${{ runner.os }}-${{ env.GST_VERSION }}-${{ hashFiles('scripts/gen-fixtures.sh') }}

      - name: Generate test fixtures
        shell: bash
        run: ./scripts/gen-fixtures.sh

      # ---------------- Sample project media (TASK-109, TASK-132) -------
      # examples/sample-project/demo.sub plays three CC0 clips, each pinned by
      # size and SHA-256. They are never committed and only ~4.7 MB together.
      # They are served from this project's own release assets
      # (releases/tag/sample-media-v1), not from Wikimedia Commons where they
      # were first published: Wikimedia answered concurrent runs off shared
      # runner egress with HTTP 429, and no CI run should depend on a
      # third-party site. The Commons URLs stay in the script and the manifest
      # for provenance and are never contacted here.
      #
      # The media is cached exactly as the fixtures are: one entry per OS keyed
      # on both fetch scripts, restore-only on pull requests. On a warm restore
      # the fetch step downloads nothing at all -- not even the checksum file,
      # which the script only pulls when a file actually has to be fetched. A
      # partial restore is safe: the script keeps a file whose hash already
      # matches and re-downloads anything else.
      #
      # sub-ui's sample_project_render test decodes and composites this media;
      # without it that test skips itself rather than failing, so a fetch that
      # goes wrong is visible in this step rather than as a red test.
      - name: Restore the sample media cache
        id: sample-media-cache
        uses: actions/cache/restore@v4
        with:
          path: examples/sample-project/media
          key: sample-media-${{ runner.os }}-${{ hashFiles('scripts/get-sample-media.sh', 'scripts/get-sample-media.ps1') }}

      - name: Fetch the sample project media (TASK-109)
        shell: bash
        run: ./scripts/get-sample-media.sh

      - name: Save the sample media cache
        if: github.ref == 'refs/heads/main' && steps.sample-media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: examples/sample-project/media
          key: ${{ steps.sample-media-cache.outputs.cache-primary-key }}

      # ---------------- GPU (TASK-19) ----------------
      # Hosted runners have no GPU. Linux gets Mesa's lavapipe so wgpu can
      # enumerate a software Vulkan adapter, plus Xvfb to give winit a
      # display; Windows falls back to WARP through D3D12 and macOS runners
      # already provide Metal.
      #
      # x11-utils (xdpyinfo), x11-apps (xwd) and ImageMagick are what the
      # window smoke test photographs the app with (TASK-123); they are small
      # next to the GStreamer set above.
      - name: Install a software GPU and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 xvfb libxkbcommon-x11-0 \
            x11-utils x11-apps x11-xserver-utils imagemagick
      # -----------------------------------------------

      - name: Build
        run: cargo build --workspace --all-targets

      # The hosted macOS runners have no usable GPU, so every VideoToolbox
      # decoder aborts the process inside Metal ("invalid
      # descriptor.maxCommandBufferCount value 0") as soon as it is plugged --
      # both by our own autoplug and by the discoverer's while probing.
      # Deranking `vtdec` and `vtdec_hw` to NONE keeps them out of the registry
      # scan sub-media promotes from (it only considers factories at MARGINAL
      # or above), so macOS CI decodes in software. Hardware decode on Apple
      # silicon is covered by the manual `verify` tasks, not here.
      #
      # One invocation, and it selects exactly what the Build step above
      # selected (TASK-131). Cargo unifies features across the packages a
      # command selects, so a different selection is a different feature set
      # and invalidates the previous step's artifacts. This step used to be
      # `cargo test --workspace --exclude sub-ui` followed by `cargo test -p
      # sub-ui`, which is three selections in a row counting the Build step:
      # windows-latest in run 34574614657 spent 156 s recompiling before the
      # first test ran, then a further 197 s recompiling before the second,
      # against 89 s of tests actually executing -- 353 s of a 462 s step, and
      # the same shape on the other two runners. Keep the selection here equal
      # to the Build step's or the recompiles come straight back.
      #
      # `--test-threads=1` is what lets the two invocations become one.
      # sub-ui's snapshot tests each build their own wgpu device, and on Linux
      # that device is Mesa's lavapipe. Several of them rendering at once (the
      # default is one test thread per core) crashes the driver: the job dies
      # with "signal: 11, SIGSEGV" part way through whichever sub-ui test
      # binary got there first, with no panic and no failing assertion. One
      # test at a time keeps a single software device alive at a time. It
      # applies to the whole workspace rather than to sub-ui alone, which costs
      # about a minute of lost parallelism in the non-UI crates. The five
      # slowest Windows test binaries in that run were sub-media's
      # seek_fixtures at 9.3 s, sub-test-support's sample_media_catalogue at
      # 5.4 s and sub-ui's timeline_selection at 3.8 s, inspector at 3.6 s and
      # timeline_transition at 3.1 s; everything else was under 3 s and the
      # whole suite executes in 89 s. No test is skipped, gated or moved to
      # another OS by any of this.
      #
      # SUB_REQUIRE_SAMPLE_MEDIA turns sub-ui's sample-project render test from
      # "skip when the media is missing" into "fail": this job is the evidence
      # that examples/sample-project/demo.sub opens without a relink on Linux,
      # Windows and macOS alike (TASK-109 criterion 2), and a run that skipped
      # the test because the fetch step went wrong would prove nothing. The
      # fetch step above ran on every OS, so the media is there.
      #
      # The Windows runners have the Media Foundation H.264 encoder registered
      # -- the MFT is part of Windows -- but no GPU behind it, and it reaches
      # READY and then refuses to negotiate any input format, so every export
      # that picked it died with "streaming stopped, reason not-negotiated" at
      # the appsrc feeding it (run 34590849305). It outranks x264enc in the
      # selection order, so that was every real export on Windows. Deranking it
      # to NONE is the same escape hatch as vtdec above, and the encoder probe
      # honours a NONE rank, so selection falls through to x264enc.
      #
      # The macOS runners are the same story on the encode side: the
      # VideoToolbox encoders register, outrank x264enc and then fail inside
      # the session output callback on the GPU-less hosts ("Failed to encode
      # frame 0: -12902", run 34627554258), so sub-export's job tests died on
      # every real export. Derank vtenc_h264 and vtenc_h265 alongside the
      # decoders; hardware encode stays covered by the manual verify tasks.
      - name: Test
        shell: bash
        env:
          GST_PLUGIN_FEATURE_RANK: ${{ runner.os == 'macOS' && 'vtdec:NONE,vtdec_hw:NONE,vtenc_h264:NONE,vtenc_h265:NONE' || runner.os == 'Windows' && 'mfh264enc:NONE,mfh265enc:NONE' || '' }}
          SUB_REQUIRE_SAMPLE_MEDIA: '1'
        run: cargo test --workspace -- --test-threads=1

      # egui_kittest writes <name>.new.png and <name>.diff.png next to the
      # committed reference whenever a UI snapshot does not match (TASK-119).
      # Keep them so the change can be looked at without a local run; they are
      # gitignored and only exist when the test job failed.
      - name: Upload UI snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshot-diffs-${{ matrix.os }}
          path: |
            crates/sub-ui/tests/snapshots/**/*.new.png
            crates/sub-ui/tests/snapshots/**/*.diff.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The SDK generates one WIT world per cargo feature and only the default
      # one, `command`, is in the workspace build above. Lint the other eight so
      # a WIT change that breaks a world is caught here rather than by the first
      # plugin that targets it (TASK-89). Linux only: the bindings are
      # target-neutral.
      - name: Plugin SDK worlds
        if: runner.os == 'Linux'
        run: |
          for world in effect effect-cpu commands mcp-tools audio-effect importer exporter analyzer; do
            echo "::group::subordinate-sdk ($world)"
            cargo clippy -p subordinate-sdk --no-default-features --features "$world" -- -D warnings
            echo "::endgroup::"
          done

      # The reference audio-effect plugin is its own one-package workspace, so
      # the steps above never see it. Build it as a component and run its DSP
      # tests on the host triple, on Linux only: the plugin is target-neutral
      # and the WASM output is identical on every runner (TASK-77).
      - name: Reference plugin (audio-effect)
        if: runner.os == 'Linux'
        working-directory: plugins/gain
        run: |
          cargo build --release --target wasm32-wasip2
          cargo test
          cargo fmt --all --check

      # The first-party cut-silence plugin, likewise its own workspace. The
      # decoder, the detector and the planner are plain Rust and are tested on
      # the host triple; the component itself is what `plugin install` takes
      # (TASK-99).
      - name: First-party plugin (cut-silence)
        if: runner.os == 'Linux'
        working-directory: plugins/cut-silence
        run: |
          cargo build --release --target wasm32-wasip2
          cargo test
          cargo fmt --all --check

      # The reference effect plugin, likewise its own workspace (TASK-100). Its
      # shader and its parameter table are also rendered by sub-render's
      # `color_plugin_golden` test, which the ordinary workspace test job runs.
      - name: Reference plugin (effect)
        if: runner.os == 'Linux'
        working-directory: plugins/color
        run: |
          cargo build --release --target wasm32-wasip2
          cargo test
          cargo fmt --all --check

      # The OTIO interchange plugins are a second self-contained workspace
      # holding two components — the `importer` world and the `command` world —
      # plus the conversion crate both share. Everything but the component glue
      # is tested on the host triple; the wasm build is what proves the glue
      # still satisfies the WIT (TASK-101). Linux only, as above.
      - name: First-party plugins (OpenTimelineIO)
        if: runner.os == 'Linux'
        working-directory: plugins/otio
        run: |
          cargo build --release --target wasm32-wasip2 --workspace
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo fmt --all --check

      # Start the real app, paint a few empty frames and exit. This is what
      # proves eframe comes up on the wgpu backend on every OS (TASK-19 #3).
      #
      # The binary the Build step produced, not `cargo run -p subordinate`:
      # a single-package selection is a different feature unification from the
      # Build step's `--workspace`, so cargo relinked four crates and the
      # binary every time -- 55 s of the windows-latest job in run 34574614657
      # (TASK-131). The window smoke test below already invokes the binary this
      # way.
      - name: GUI smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          RUST_LOG: info
        run: xvfb-run -a target/debug/subordinate --smoke-test

      - name: GUI smoke test (Windows and macOS)
        if: runner.os != 'Linux'
        shell: bash
        env:
          RUST_LOG: info
        run: |
          bin=target/debug/subordinate
          if [ "$RUNNER_OS" = "Windows" ]; then bin=target/debug/subordinate.exe; fi
          "$bin" --smoke-test

      # ---------------- Headless render smoke test (TASK-63) ----------------
      # The sample project rendered by the headless CLI on every OS: decode,
      # composite, mix and encode, end to end, with the software x264 encoder
      # pinned so all three runners write the same codec whatever hardware they
      # happen to expose. `--verify` probes the written file with the GStreamer
      # discoverer and fails the step when it carries no video, so a render that
      # exits zero having written a broken file cannot pass.
      #
      # A second of the sequence rather than the whole thing: the point is that
      # the path works on this OS, and the frame-accurate proofs live in the
      # workspace tests. The step is skipped when the sample media fetch above
      # did not land, exactly as the render test in sub-ui skips.
      - name: Headless render smoke test
        shell: bash
        env:
          RUST_LOG: info
        run: |
          if [ ! -d examples/sample-project/media ]; then
            echo "no sample media; skipping the headless render"
            exit 0
          fi
          bin=target/debug/subordinate-cli
          if [ "$RUNNER_OS" = "Windows" ]; then bin=target/debug/subordinate-cli.exe; fi
          "$bin" render examples/sample-project/demo.sub \
            --sequence "Main cut" \
            --preset mezzanine \
            --encoder x264enc \
            --range 0:25 \
            --out target/sample-render.mkv \
            --verify

      # ---------------- Window smoke test (TASK-123) ----------------
      # The assembled app rather than a panel in isolation: Xvfb gives it one
      # wide screen split into two RandR monitors, the app opens the sample
      # project and puts its pop-out viewer on the second monitor, and one PNG
      # per monitor is captured once both windows have painted. Steps of the
      # Linux job rather than a job of their own, because a separate job would
      # rebuild the whole workspace -- these reuse the debug binary the build
      # step already produced, which is what keeps the cost near the 25-second
      # hold plus the apt packages above. Windows and macOS skip it: there is
      # no Xvfb there, and the GUI smoke test above already proves the window
      # comes up on each OS.
      - name: Window smoke test with screenshots (Linux)
        if: runner.os == 'Linux'
        env:
          RUST_LOG: info
        run: |
          # The sample media was fetched earlier in this job, so the demo
          # project the script picks up has real footage and the viewer has
          # something to decode. --require-picture turns that from a
          # screenshot someone has to look at into an assertion (TASK-144).
          ./scripts/ui-smoke.sh --binary target/debug/subordinate --require-picture
          cat target/ui-smoke/summary.md >> "$GITHUB_STEP_SUMMARY"

      # Uploaded even when the step failed: a screenshot of a broken window is
      # exactly what an agent needs to see. `gh run download -n ui-smoke-<sha>`
      # fetches the PNGs and the app log.
      - name: Upload window screenshots (Linux)
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-${{ github.sha }}
          path: |
            target/ui-smoke/*.png
            target/ui-smoke/*.log
            target/ui-smoke/screens.txt
            target/ui-smoke/windows.txt
            target/ui-smoke/monitors.txt
          if-no-files-found: warn
          retention-days: 14
      # ---------------------------------------------------------------

      # ---------------- Performance harness (TASK-26) ----------------
      # Linux only, and on the same debug artifacts the test step already
      # built: the point is a repeatable number per commit, not an absolute
      # one, and a release rebuild here would cost more than the measurement
      # is worth. The runner has no GPU, so the texture stage runs on Mesa's
      # lavapipe and every number is an upper bound -- the report says so.
      # The harness never fails the job on an environment problem: a missing
      # fixture or adapter is recorded as a skipped or decode-only scenario.
      # Baselines and how to read them: docs/PERFORMANCE.md.
      - name: Scrub and playback benchmark (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a cargo run -p subordinate-bench -- \
            --out target/bench/perf.json | tee target/bench-summary.txt
          {
            echo '### Scrub and playback benchmark'
            echo
            echo '```'
            cat target/bench-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The before half of TASK-133's before-and-after, on the machine the exit
      # criterion's software half is stated against: the same harness with the
      # seek path as it was, so the drag scenario's improvement is measured per
      # commit rather than argued from a developer's laptop. Reported in the
      # job summary, never gated, and it costs one more pass over two
      # five-second clips.
      - name: Scrub benchmark with the pre-TASK-133 seek path (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          xvfb-run -a cargo run -p subordinate-bench -- --legacy-scrub \
            --out target/bench/perf-legacy.json | tee target/bench-summary-legacy.txt
          {
            echo '### The same scrub with the pre-TASK-133 seek path'
            echo
            echo '```'
            cat target/bench-summary-legacy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: |
            target/bench/perf.json
            target/bench/perf-legacy.json
          if-no-files-found: warn
          retention-days: 30

      # ---------------- A/V sync and drift (TASK-56) ----------------
      # Phase 3's exit criterion: the picture stays inside one frame of the
      # audio clock over the whole ten-minute fixture. That fixture is the one
      # the earlier step deliberately skips, so it is generated here -- Linux
      # only, and only for this measurement.
      #
      # Unlike the performance harness, this step is allowed to fail the job:
      # drift of a whole frame or more exits non-zero, which is how the
      # criterion is asserted. A missing fixture is still a skipped run, not a
      # failure. Numbers and how to read them: docs/PERFORMANCE.md.
      - name: Generate the long fixture (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/gen-fixtures.sh --long

      # Written here rather than at the end of the job so the entry covers the
      # long clip too, and skipped entirely when the restore above was an exact
      # hit (there would be nothing new to store).
      - name: Save the fixture cache
        if: github.ref == 'refs/heads/main' && steps.fixture-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: fixtures
          key: ${{ steps.fixture-cache.outputs.cache-primary-key }}

      - name: A/V sync and drift harness (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -p subordinate-bench -- --sync \
            --out target/bench/av-sync.json | tee target/av-sync-summary.txt
          {
            echo '### A/V sync and drift'
            echo
            echo '```'
            cat target/av-sync-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload A/V sync report
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: av-sync-report
          path: target/bench/av-sync.json
          if-no-files-found: warn
          retention-days: 30
      # ---------------------------------------------------------------
