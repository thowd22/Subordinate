[package]
name = "subordinate-mcp"
description = "MCP stdio bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "subordinate_mcp"
path = "src/lib.rs"

[[bin]]
name = "subordinate-mcp"
path = "src/main.rs"

[dependencies]
sub-command = { version = "0.1.0", path = "../../crates/sub-command" }
sub-core = { version = "0.1.0", path = "../../crates/sub-core" }
rmcp = { version = "3.2", default-features = false, features = ["server", "transport-io"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-std", "macros", "rt", "sync"] }
tracing = "0.1"

[dev-dependencies]
sub-edit = { version = "0.1.0", path = "../../crates/sub-edit" }
sub-model = { version = "0.1.0", path = "../../crates/sub-model" }
sub-time = { version = "0.1.0", path = "../../crates/sub-time" }
# Test-only: the bridge integration test serves the plugin host's methods from
# the editor side, which is what makes the plugin_* tools reachable.
# `test-guests` builds the wasm components that crate's own tests use; the
# plugin tool test here installs one of them and calls its tool for real.
sub-plugin = { version = "0.1.0", path = "../../crates/sub-plugin", features = [
    "test-guests",
] }

[lints]
workspace = true
