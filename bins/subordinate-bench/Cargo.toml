[package]
name = "subordinate-bench"
description = "Benchmark harness: decode-to-texture latency and sustained scrub fps on the media fixtures"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sub-audio = { version = "0.1.0", path = "../../crates/sub-audio" }
sub-core = { version = "0.1.0", path = "../../crates/sub-core" }
sub-edit = { version = "0.1.0", path = "../../crates/sub-edit" }
sub-media = { version = "0.1.0", path = "../../crates/sub-media" }
sub-render = { version = "0.1.0", path = "../../crates/sub-render" }
sub-test-support = { version = "0.1.0", path = "../../crates/sub-test-support" }
sub-time = { version = "0.1.0", path = "../../crates/sub-time" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
wgpu = { version = "30", default-features = false, features = ["wgsl"] }

[lints]
workspace = true
